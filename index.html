nn,","Dogga med smil og med tåre.","Her hev det flødt ei såkornflod","Varm av vårt beste hjarteblod,","Her hev me grorbotn å veksa."],["Tidi ho renn som elv mot os,","Fort skifter sumar med vetter.","Fader, ver alltid Noregs los","Radt til dei seinaste ætter;","Herre, vår Gud, vårt Noregs Gud,","Varda vårt land frå fjell til flud,","Lær oss å gå dine vegar!"],["Signa då, Gud, vårt folk og land,","Signa vårt strev og vår møda,","Signa kvar ærleg arbeidshand,","Signa vår åker meg grøda!","Gud, utan deg den vesle urt","Veiknar og visnar, bleiknar burt,","Ver du oss ljoset og livet!"]],"tittel":"Fagert er landet du oss gav"},{"nr":123,"seksjon":"17. mai","vers":[["Ja, vi elsker dette landet Som det stiger frem,","Furet, værbitt, over vannet, Med de tusen hjem;","Elsker, elsker det og tenker På vår far og mor,",":/: Og den saganatt som senker Drømme på vår jord. :/:"],["Norske mann i hus og hytte, Takk din store Gud!","Landet ville han beskytte, Skjønt det mørkt så ut.","Alt hva fedrene har kjempet, Mødrene har grett,",":/: Har den Herre stille lempet, Så vi vant vår rett. :/:"]],"tittel":"Ja, vi elsker dette landet Som det stiger frem"},{"nr":124,"seksjon":"17. mai","vers":[["Den blomstertid nu kommer Med lyst og glede stor,","Den kjære lyse sommer, Da gress og grøde gror.","Nu varmer sol i lide Alt som har været dødt;","Med hver den dag mon skride, Blir allting som gjenfødt."],["De fagre blomsterenger Og akrer rad på rad,","De grønne urtestenger Og skog som skyter blad,","De skal oss høyt påminne Hvor Gud er stor og god,","Som år for år lar rinne Sin nådes rike flod."],["Vi hører fugler sjunge Med mangehånde lyd,","Skal ikke da vår tunge Lovsynge Gud med fryd?","Min sjel, opphøy Guds ære Med lov og gledesang,","Han vil oss nådig være Nu som så mangen gang!"],["Men kjære Herre Kriste, Vår gledessol og skinn,","La hjerte-isen briste Og smelte i vårt sinn!","La kjærlighetens sæle Og søte ånde gå","Igjennom våre sjele At kvege blomster små!"],["Du Sarons rene lilje, Guds blomst i grønne dal,","Du vende deg til vilje Mitt hjertes attrå all!","La dugg av Sion komme, At min vansmekted' ånd","Må stå som rosens blomme I lys på Libanon!"],["Gud signe årets grøde, Og fruktbargjør vårt land!","Gi oss nødtørftig føde, Velsigne land og strand!","La dine budord følges, Og fød oss med ditt ord,","La nådens lys ei dølges For oss på denne jord!"]],"tittel":"Den blomstertid nu kommer Med lyst og glede stor"},{"nr":125,"seksjon":"Advent","vers":[["Gjør døren høy, gjør porten vid,","Den ærens konge kommer hit.","Han hersker over alle land","Og er all verdens Frelser sann."],["Rettferdig kommer han her ned","Og byder salighet og fred,","Saktmodig fremmer han sin akt","Og herske vil med miskunns makt."],["Han roper ut et nådens år,","Vår nød ved ham en ende får,","Derfor av lengselsfulles tall","En gledesang ham møte skal."],["Å vel det land, det hus, den gård","Hvor denne mann for styre står!","Å vel det hjerte, sjel og sinn","Hvor denne konge drager inn!"],["Han er den rette gledesol","Som lyser fra Guds nådestol,","Ved ham, Guds Sønn, det lysne må","I våre hjerters mørke vrå."],["Gjør døren høy, riv stengsel ned,","I hjertet rom for ham bered,","Så kommer ærens konge sterk","Og fremmer i deg alt Guds verk."],["Mitt hjertes dør jeg åpner deg,","O Jesus, kom hit inn til meg,","Og ved din nåde la det skje","At jeg din vennlighet må se!"],["Ja ved din Hellig Ånd det gjør","Vi daglig åpner deg vår dør,","Og deg oss kun til frelse vet,","Velsignet i all evighet!"]],"tittel":"Gjør døren høy, gjør porten vid"},{"nr":126,"seksjon":"Advent","vers":[["Fryd deg, du Kristi brud, I mot din Herre Gud!","For hånden er hans nåde, Som deg profeten spådde."],["Kor: Hosianna! Pris og ære Skal denne konge være!"],["Gå ham i møte nu Med fryd i sjel og hu!","Her rider ærens konning, Gled deg, du Sions dronning!"],["Se, ham et asen bær Som herrers Herre er;","Hans prakt er såre ringe, Dog han kan døden tvinge!"],["Saktmodig i sitt sinn Han rider til deg inn,","Han nåde med seg fører, Den fritt hans brud tilhører!"],["Gjør porten høy og vid, Nu er det nådens tid,","Nu Kristus vil deg gjeste Din salighet til beste!"],["Strø grener på hans vei, Spar dine kleder ei!","Alt folket bære palmer Og synge frydesalmer!"],["Umyndige og små Skal gjøre likeså,","Og lytt den hele skare Hans lov skal åpenbare."]],"tittel":"Fryd deg, du Kristi brud, I mot din Herre Gud"},{"nr":127,"seksjon":"Jul","vers":[["Deilig er den himmel blå,","Lyst det er å se derpå","Hvor de gylne stjerner blinker,","Hvor de smiler, hvor de vinker",":/: Oss fra jorden opp til seg. :/:"],["Det var midt i julenatt,","Hver en stjerne glimtet matt,","Da med ett der blev å skue","En så klar på himlens bue",":/: Som en liten stjernesol. :/:"],["Når den stjerne lys og blid","Lot seg se ved midnattstid,","Var det varslet i Guds rike","At en konge uten like",":/: Skulle fødes på vår jord. :/:"],["Stjernen ledet vise menn","Til den Herre Kristus hen.","Vi har og en ledestjerne,","Og når vi den følger gjerne,",":/: Kommer vi til Jesus Krist. :/:"],["Denne stjerne lys og mild","Som kan aldri lede vill,","Er hans guddoms ord det klare","Som han lot oss åpenbare",":/: For å lyse for vår fot. :/:"]],"tittel":"Deilig er den himmel blå"},{"nr":128,"seksjon":"Jul","vers":[["Å, kom nå med lovsang, Jordens kristenskare!","Å, kom nå med lovsang til Betlehem!","Kom for å se ham, kongen i en krybbe!"],["Kor: Kom, tilbe ham, Guds under!","Kom, tilbe ham, Guds under!","Kom, tilbe ham, Guds under: Vår Herre Krist!"],["Gud, evig Gud og lys av lys det er han!","Til oss er han kommet som bror i dag.","Sann Gud av opphav, født før alle tider."],["Syng, englehærer, syng med salig jubel!","Å syng myriader, i himlens slott:","Ã†re til Gud og fred blant oss på jorden!"],["Herre, vi hyller deg som kom til jorden.","Barn Jesus, deg hører velsignelsen til.","Ordet ble kjød og bor i dag iblant oss."]],"tittel":"Å, kom nå med lovsang, Jordens kristenskare"},{"nr":129,"seksjon":"Jul","vers":[["Deilig er jorden. Prektig er Guds himmel.","Skjønn er sjelenes pilgrimsgang!","Gjennom de fagre Riker på jorden","Går vi til paradis med sang."],["Tider skal komme. Tider skal henrulle.","Slekt skal følge slekters gang.","Aldri forstummer Tonen fra himlen","I sjelens glade pilgrimssang."],["Englene sang den Først for markens hyrder.","Skjønt fra sjel til sjel det lød:","Fred overjorden, Menneske, fryd deg,","Oss er en evig Frelser født!"]],"tittel":"Deilig er jorden. Prektig er Guds himmel"},{"nr":130,"seksjon":"Jul","vers":[["Det hev ei rose sprunge Ut av ei rot så grann.","Som fedrane hev sunge: Av Isais rot ho rann,","Og var ein blome blid Midt i den kalde vinter","Ved mørke midnattstid."],["Om denne rosa eine Er sagt Jesaias ord.","Maria møy, den reine, Bar rosa til vår jord.","Og Herrens miskunnsmakt Det store under gjorde","Som var i spådom sagt."],["Guds rose ljuvleg angar Og skin i jordlivs natt.","Når hennar ljos oss fangar, Ho vert vår beste skatt.","Me syng i englelag: No er det fødd ein Frelsar,","Og natti vart til dag."]],"tittel":"Det hev ei rose sprunge Ut av ei rot så grann"},{"nr":131,"seksjon":"Jul","vers":[["Det kimer nå til julefest,","Det kimer for den høye gjest","Som steg til lave hytter ned","Med nyttårsgaver, fryd og fred."],["Å, kom nå med til Davids by,","Hvor engler synger under sky!","Å, gå dog med på marken ut","Hvor hyrder hører nytt fra Gud!"],["O, la oss gå med stille sinn","Som hyrdene til barnet inn,","Med gledestårer takke Gud","For miskunnhet og nådebud!"],["O Jesus, verden vid og lang","Til vogge var deg dog for trang,","For ringe om med gull tilredd","Og perlestukket, silkebredd."],["Men verdens ære, makt og gull","For deg er bare støv og muld.","I krybben lagt, i kluter svøpt,","Et himmelsk liv du meg har kjøpt."],["Så vær, min sjel, nå hjerteglad","Og hold din jul i Davids stad,","Ja, pris din Gud i allen stund","Med liflig sang av hjertens grunn!"],["Kom, Jesus, vær vår hedersgjest,","Og hold hos oss din julefest!","Da skal med Davids-harpens klang","Deg takke høyt vår jubelsang."]],"tittel":"Det kimer nå til julefest"},{"nr":132,"seksjon":"Jul","vers":[["Det lyser i stille grender","Av tindrande ljos i kveld,","Og tusene barnehender","Mot himmelen ljosa held."],["Og glade med song dei helsar","Sin broder i himmelhall,","Som kom og vart heimsens","Frelsar Som barn i ein vesal stall."],["Der låg han med høy til pute","Og gret på si ringe seng,","Men englane song der ute","På Betlehems aude eng."],["Der song dei for fyrste gongen","Ved natt over Davids by","Den evige himmelsongen,","Som alltid er ung og ny."],["Den songen som atter tonar","Med jubel kvar julenatt","Om barnet, Guds son, vår sonar,","Som døden for evig batt."]],"tittel":"Det lyser i stille grender"},{"nr":133,"seksjon":"Jul","vers":[["En krybbe var vuggen som ventet ham her,","Det lille barn Jesus, vår Frelser så kjær.","Men stjernene lyste helt inn der han lå,","Det lille barn Jesus, på leiet av strå."],["Så enkelt og stille kom Gud til vårjord,","Så høyt er jeg elsket av Jesus, min bror.","Han kom fra Guds himmel, Gud selv var han lik,","Men Jesus ble fattig, og jeg er blitt rik."],["Fra krybben til korset gikk veien for deg,","Slik åpnet du porten til himlen for meg.","Velsign oss, vær med oss, gi lys på vår vei,","Så alle kan samles i himlen hos deg."]],"tittel":"En krybbe var vuggen som ventet ham her"},{"nr":134,"seksjon":"Jul","vers":[["Et barn er født i Betlehem, i Betlehem","Ti gleder seg Jerusalem. Halleluja, halleluja."],["En fattig jomfru satt i lønn, hun satt i lønn,","Og fødte himlens kongesønn. Halleluja, halleluja."],["Han lagdes i et krybberom, et krybberom,","Guds engler sang med fryd derom. Halleluja, halleluja."],["Men okse der og asen sto, og asen sto,","Og så den Gud og Herre god. Halleluja, halleluja."],["Av Saba kom de konger tre, de konger tre,","Gull, røkels, myrra ofret de. Halleluja, halleluja."],["Nu all vår nød og sorg er bøtt, vår sorg er bøtt,","Oss er i dag en Frelser født. Halleluja, halleluja."],["Lov, takk og pris i evighet, i evighet,","Den hellige Trefoldighet. Halleluja, halleluja."]],"tittel":"Et barn er født i Betlehem, i Betlehem"},{"nr":135,"seksjon":"Jul","vers":[["Glade Jul, Hellige jul!","Engler daler ned i skjul.","Hit de flyver med paradisgrønt.","Hvor de ser hva for Gud er skjønt,",":/: Lønnlig iblant oss de går. :/:"],["Julefryd, Evige fryd,","Hellig sang med himmelsk lyd!","Det er engler som hyrdene så","Dengang Herren i krybben lå.",":/: Evig er englenes sang. :/:"],["Fred på jord, Fryd på jord.","Jesusbarnet blant oss bor!","Engler synger om barnet så smukt.","Han har himmeriks dør opplukt.",":/: Salig er englenes sang. :/:"],["Salig fred, Himmelsk fred","Toner julenatt her ned.","Engler bringer til store og små","Bud om ham som i krybben lå.",":/: Fryd deg hver sjel han har frelst! :/:"]],"tittel":"Glade Jul, Hellige jul"},{"nr":136,"seksjon":"Jul","vers":[["Gud sin egen Sønn oss gav Nå ved juletide.","Derfor går et lovsangshav Over verden vide.","Derfor fra det høye kor Lyder det her nede;","Give er din sak på jord, Gi, og gi med glede!"],["Gi din Gud ditt hjerte hen, Gi din ringe neste!","Gi din uvenn og din venn, Gi dem av ditt beste!","Gi til du blir tom og arm, Intet skal du miste!","Gi til du blir rik og varm, Rikest på det siste!"]],"tittel":"Gud sin egen Sønn oss gav Nå ved juletide"},{"nr":137,"seksjon":"Jul","vers":[["Her kommer dine arme små,","O Jesus, i din stall å gå.","Opplys enhver i sjel og sinn","Å finne veien til deg inn."],["Vi løper deg med sang imot","Og kysser støvet for din fot.","Å salig stund, å søte natt","Da du ble født vår sjeleskatt."],["Velkommen fra din himmelsal","Til denne verdens tåredal!","Hvor man deg intet annet bød","Enn stall og krybbe, kors og død."],["Men, Jesus akk hvor går det til","At dog så få betenke vil","Den store, store kjærlighet","Som drog deg til vår jammer ned."],["Å drag oss ganske til deg hen,","Du store, milde sjelevenn,","Så vi i troen favner deg","Og følger på din himmelvei."],["La verden ei med all sin makt","Oss vende bort fra dåpens pakt!","Men gi at all vår lengsel må","Til deg, til deg alene stå!"],["Så skal det skje at vi engang","Blant alle helgners frydesang","I himlens glade paradis","Skal prise deg på englevis."],["Her står vi nu i flokk og rad","Om deg vårt skjønne hjerteblad.","Akk, hjelp at vi og alle må","I himlen for din trone stå!"]],"tittel":"Her kommer dine arme små"},{"nr":138,"seksjon":"Jul","vers":[["Barn Jesus i en krybbe lå,","Skjønt himlen var hans eie.","Hans pute her var høy og strå,","Mørkt var det om hans leie.","Men stjernen lyste skjønn og klar,","Om sjø og land sin glans den bar.","Halleluja, halleluja, barn Jesus!"],["Hver sorgfull sjel blir frisk og glad,","Og legger bort sin smerte,","Et barn er født i Davids stad","Til trøst for hvert et hjerte.","Til dette barnet skal vi gå","For barnesinn igjen å få.","Halleluja, halleluja, barn Jesus!"]],"tittel":"Barn Jesus i en krybbe lå"},{"nr":139,"seksjon":"Jul","vers":[["Jeg er så glad hver julekveld, For da ble Jesus født.","Da lyste stjernen som en sol, Og engler sang så søtt."],["Det lille barn i Betlehem, Han var en konge stor,","Som kom fra himlens høye slott Ned til vår arme jord."],["Nå bor han høyt i himmerik. Han er Guds egen sønn,","Men husker alltid på de små Og hører deres bønn."],["Jeg er så glad hver julekveld, Da synger vi hans pris.","Da åpner han for alle små Sitt søte paradis."],["Da tenner moder alle lys Så ingen krok er mørk.","Hun sier stjernen lyste så I hele verdens ørk."],["Hun sier at de engler små, De synger og i dag,","Om fred og fryd på jorderik, Og om Guds velbehag."],["Jeg holder av vår julekveld Og av den Herre Krist,","Og at han elsker meg igjen, Det vet jeg ganske visst."]],"tittel":"Jeg er så glad hver julekveld, For da ble Jesus født"},{"nr":140,"seksjon":"Jul","vers":[["Jeg synger julekvad. Jeg er så glad, så glad!","Min hjertens Jesus hviler I stall og krybbe trang.","Som solen klare smiler Han på sin moders fang.",":/: Han er frelser min! :/:"],["Å Jesus, du barnlill, Deg lenges jeg så til!","Kom, trøst meg allesinne, Tred inn om her er smått.","La meg deg se å finne. Å, da har jeg det godt.",":/: Drag meg etter deg! :/:"],["Hvor er Gud Fader mild, Sin Sønn oss sende vil!","Vi alle var fordervet I synd og vår udyd,","Så har han oss forvervet All himlens, himlens fryd.",":/: Eia, var vi der! :/:"],["Hvor er vel glede slik Som opp i himmerik,","Hvor alle engler kveder En ny og liflig sang,","Og frem for tronen treder Til Guds basuners klang!",":/: Eia, var vi der! :/:"]],"tittel":"Jeg synger julekvad. Jeg er så glad, så glad"},{"nr":141,"seksjon":"Jul","vers":[["Kimer, I klokker, ja kimer før dag i det dunkle!","Tindrer, I stjerner, som englenes øyne kan funkle!","Fred kom til jord, Himmelens fred med Guds ord!","Æren er Guds i det høye!"],["Julen er kommet med solverv for hjertene bange,","Jul med Gudsbarnet i svøp under englenes sange,","Kommer fra Gud, Bringer oss glederikt bud.","Æren er Guds i det høye!"],["Synger og leker og klapper i deres små hender.","Menneskebarnene alle til jorderiks ender!","Født er i dag Barnet til Guds velbehag.","Æren er Guds i det høye!"]],"tittel":"Kimer, I klokker, ja kimer før dag i det dunkle"},{"nr":142,"seksjon":"Jul","vers":[["Mitt hjerte alltid vanker I Jesu føderom,","Der samles mine tanker Som i sin hovedsum.","Der er min lengsel hjemme, Der har min tro sin skatt,","Jeg kan deg aldri glemme, Velsignet julenatt!"],["Den mørke stall skal være Mitt hjertes frydeslott,","Der kan jeg daglig lære Å glemme verdens spott.","Der kan med takk jeg finne Hvori min ros består,","Når Jesu krybbes minne Meg rett til hjerte går."],["Men under uten like, Hvor kan jeg vel forstå","At Gud av himmerike I stallen ligge må!","At himlens fryd og ære, Det levende Guds ord","Skal så foraktet være På denne arme jord!"],["Hvi skulle herresale Ei smykket for deg stå?","Du hadde å befale Alt hva du pekte på.","Hvi lot du deg ei svøpe I lyset som et bånd","Og jordens konger løpe Å kysse på din hånd?"],["Hvi lot du ei utspenne En himmel til ditt telt","Og stjernefakler brenne, O store himmelhelt?","Hvi lot du frem ei trede En mektig englevakt,","Som deg i dyre klede Så prektig burde lagt?"],["En spurv har dog sitt rede Og sikre hvilebo,","En svale må ei bede Om nattely og ro,","En løve vet sin hule Hvor den kan hvile få -","Skal da min Gud seg skjule I andres stall og strå."],["Akk kom, jeg opp vil lukke Mitt hjerte og mitt sinn","Og full av lengsel sukke: Kom, Jesus, dog her inn!","Det er ei fremmed bolig, Du har den selv jo kjøpt,","Så skal du blive trolig Her i mitt hjerte svøpt."],["Jeg gjerne palmegrene Vil om din krybbe strø,","For deg, for deg alene Jeg leve vil og dø.","Kom la min sjel dog finne Sin rette gledes stund,","At du er født her inne I hjertets dype grunn!"]],"tittel":"Mitt hjerte alltid vanker I Jesu føderom"},{"nr":143,"seksjon":"Jul","vers":[["Nå tennes tusen julelys, Det stråler rundt vår jord,","Og himlens stjerner blinker ned Til liten og til stor."],["Og over by og land i kveld Går julens glade bud","Om han som fødtes i en stall, Vår Frelser og vår Gud."],["Du stjerne over Betlehem, Send dine stråler ned,","Og minn oss om at julens bud Er kjærlighet og fred."],["Til hvert et fattig hjerte send Et lysstreif ifra sky,","Så finner det den rette vei, Og det blir jul på ny."]],"tittel":"Nå tennes tusen julelys, Det stråler rundt vår jord"},{"nr":144,"seksjon":"Påske","vers":[["Hin time i Getsemane","Jeg aldri glemme kan,","Da jeg i angstens blodig sved","Fikk se deg, Gud og mann."],["Kor: Jeg glemmer ei, Jeg glemmer ei,","Jeg glemmer ei din ve","Da jeg deg så i angst på kne","Hist i Getsemane."],["Da jeg blant hagens dunkle trær","I ånden vandret om,","Jeg så hvor tungt, min Jesus, lå","På deg Guds vredes dom."],["Forlatt du og av dine ble,","Ja, av din Fader med,","Og aldri jeg utgrunne kan","Hva da ditt hjerte led."],["Men skulle engang blive kold","Min kjærlighet til deg,","Da minn meg om Getsemane","Og om din sved for meg!"]],"tittel":"Hin time i Getsemane"},{"nr":145,"seksjon":"Påske","vers":[["Følger med til urtegården,","I som fristedes og falt,","Se hvor hyrden stred for hjorden,","Inntil blodet da det gjaldt!","Se hans kval, og hør hans bønn,","Lær å bede av Guds Sønn!"],["Følger med og se på tinget","Verdens dommer skjent og skjelt,","Trint av avindsmenn omringet,","Dødsdom over sannhet felt!","Venn deg, sjel, til verdens lønn,","Lær å lide av Guds Sønn!"],["Følger med til retterstedet,","Se hans kors og se hans blikk,","Se hans tørre leber vætet","Ynkelig med galledrikk!","Se ham rolig, mild og skjønn,","Lær å dø av Davids Sønn !"],["Følger med til klippegraven","I den årle morgenstund!","Mørkt der er i dødninghaven,","Lysner dog om englemunn:","Krist stod opp, som bleknet lå,","Lær oss, Herre, å oppstå!"]],"tittel":"Følger med til urtegården"},{"nr":146,"seksjon":"Påske","vers":[["Jesus lever, graven brast!","Han stod opp med guddoms velde,","Trøsten står som klippen fast","At hans død og blod skal gjelde.","Lynet blinker, jorden bever,","Graven brast, og Jesus lever!"],["Jeg har vunnet, Jesus vant,","Døden oppslukt er til seier,","Jesus mørkets fyrste bandt,","Jeg den kjøpte frihet eier.","Åpen har jeg himlen funnet,","Jesus vant, og jeg har vunnet."]],"tittel":"Jesus lever, graven brast"},{"nr":147,"seksjon":"Påske","vers":[["Klippe, du som brast for meg, La meg skjule meg i deg!","La det vann og blod som går Fra din åpne sides sår,","Rense meg i nådens pakt Fra all syndens skyld og makt."],["På min egen gjernings vei Ei din lov oppfyller jeg,","Ble min iver aldri trett, Gråt jeg meg på tårer mett,","Synd dog bliver alltid der, Du, kun du min frelse er."],["Intet kan jeg bringe deg, Til ditt kors jeg klynger meg,","Fattig i meg selv jeg er, Hjelpeløs til deg jeg ser,","Liv jeg har kun i ditt blod, Renses kun i nådens flod."],["Mens jeg drager ånde her, Når min siste stund er nær,","Når til ukjent land jeg går, Når jeg for din domstol står,","Klippe du som brast for meg, La meg skjule meg i deg!"]],"tittel":"Klippe, du som brast for meg, La meg skjule meg i deg"},{"nr":148,"seksjon":"Påske","vers":[["Naglet til et kors på jorden,","Henger under vredens torden","Himlens Herre og Guds Sønn.","Selv den eviggode Fader","Ham i kvalene forlater,","Hører taus hans angestbønn."],["Akk, hvor engstet og bedrøvet,","Inntil døden høyt bedrøvet,","Er den ømme Frelsers sjel!","Vredens fulle kalk utdrikke","Må han, skal han, ellers ikke","Bliver frelsens kalk min del."],["Hvem kan tenke på den smerte","Uten med et såret hjerte,","Om endog en synder led!","Men her led den evig høye,","Smelt mitt hjerte, gråt mitt øye,","Akk, her lider hellighet!"],["For all verdens syndebrøde","Ville verdens Frelser bløde,","Tåle spott og sår og bånd,","Og til sist all livets kilde","Senkede sitt hoved stille,","Segnet og oppgav sin ånd."],["Gode Frelser, kan jeg tåle","Kraften av en guddomstråle,","O, så send den fra deg ned!","Tenn meg, at jeg må, jeg arme,","Full av ånd og hellig varme","Kjenne all din kjærlighet."],["O, la aldri noensinne","Korsets tre meg gå av minne,","Som deg, frelsens fyrste bar!","Men la kors og død og smerte","Tale, rope i mitt hjerte","Hva min frelse kostet har!"],["Hjelp at jeg fra synden treder","Og meg alltid varsom gleder","Ved min salighet og fred!","Kjøpt jeg ble, ditt navn skje ære!","Dyrekjøpt - o la det være","Varsel for meg ved hvert fjed."],["Ja, Forsoner, la meg være","Ofret deg til takk og ære,","Helliget ditt velbehag!","Sonet ved den død du døde,","Skal jeg da frimodig møte","Deg på hin den store dag."]],"tittel":"Naglet til et kors på jorden"},{"nr":149,"seksjon":"Påske","vers":[["O Jesus Krist, jeg flyr til deg,","La meg din nåde få!","Men vender du deg bort fra meg,",":/: Hvorhen skal jeg da gå? :/:"],["Foruten deg er på vår jord,","Ei noen Frelser sann.","Du ene har det livets ord",":/: Som syndre frelse kan. :/:"],["Jeg beder deg, o Jesus god,","Min synd du meg tilgiv.","La sjelen renses i ditt blod,",":/: Og gi meg evig liv.:/:"]],"tittel":"O Jesus Krist, jeg flyr til deg"},{"nr":150,"seksjon":"Påske","vers":[["Påskemorgen slukker sorgen,","Slukker sorgen til evig tid,","Den har oss givet lyset og livet,","Lyset og livet i dagning blid.","Påskemorgen slukker sorgen,","Slukker sorgen til evig tid."],["Redningsmannen er oppstanden,","Er oppstanden i morgengry!","Helvede greder, himlen seg gleder,","Himlen seg gleder med lovsang ny.","Redningsmannen er oppstanden,","Er oppstanden i morgengry!"],["Sangen toner, vår forsoner,","Vår forsoner til evig pris,","Han ville bløde for oss å møte,","For oss å møte i paradis.","Sangen toner, vår forsoner,","Vår forsoner til evig pris."],["Fagre skarer oppad farer,","Oppad farer fra grav i sky.","Tungene gløder, Herren vi møter,","Herren vi møter med lovsang ny.","Fagre skarer oppad farer,","Oppad farer fra grav i sky!"]],"tittel":"Påskemorgen slukker sorgen"},{"nr":151,"seksjon":"Påske","vers":[["Se hvor nu Jesus treder Hen til den morderstad,","Endog man ham bereder Så stort et blodebad!"],["Endog hans guddoms øye Nu fengsel, kors og nød","Kan forut skue nøye, Ja se den visse død."],["Dog vil han fri i sinde Mot sine fiender gå,","Han vet han skal dem binde Og evig seier få."],["Hans adferd er kun ringe, Et asen er hans hest;","Dog kan han undertvinge All Satans gift og pest."],["Her er han som vil løse Hver syndebunden træl,","Her er han som vil øse Trøst i hver bange sjel."],["Her er han som nu atter Til Salem byder fred;","Gå ut, o Sions datter, Og deg i hannem gled!"],["Her er han som vil bære En tornekrans for deg,","Her er han som vil være Din drott evindelig."],["Her er han som vil gyde For deg sitt hjerteblod;","Som deg et vell vil byde Av nådens dype flod."],["O Jesus, gid jeg kunde, Som jeg så gjerne vil,","Deg ære noenlunde, O hjelp meg selv dertil!"],["Jeg gjerne mine kleder Vil brede på din vei,","Jeg med i flokken treder Som villig følger deg."],["Jeg bær og mine palmer For ærens konge frem,","Jeg synger mine salmer, O Jesus, hør du dem!"],["Mitt hosianna klinger Ved din den gode Ånd,","Min sjel til deg seg svinger, Oppløftet ved din hånd."],["Til lykke, o til lykke, Du ærens konge, gakk","Min død å undertrykke Og ha så evig takk!"]],"tittel":"Se hvor nu Jesus treder Hen til den morderstad"},{"nr":152,"seksjon":"Påske","vers":[["Som den gylne sol frembryter","Gjennom den kullsorte sky","Og sin stråleglans utskyter,","Så at natt og mulm må fly.","Så min Jesus av sin grav","Og det dype dødens hav","Oppstod ærefull av døde","Imot påskemorgenrøde."],["Takk, du store seierherre,","Takk, du livets himmelhelt,","Som ei døden kunne sperre","I det helvedmørke telt!","Takk fordi at opp du stod","Og fikk døden under fot!","Ingen tunge kan den glede","Med tilbørlig lov utkvede."],["Ligger jeg i syndens veie,","Ligger jeg i armod ned,","Ligger jeg på sykdoms leie,","Liggerjegi usselhet,","Ligger jeg fortrengt, forhatt","Og av verden helt forlatt,","Skal jeg hus i graven tage,","Å, her er dog håp tilbake!"],["Synd og død og alle pile","Som av Satan skytes kan,","Brutt de ligger ved din hvile","Hist i gravens mørke land.","Der begrov du dem og gav","Meg en sikker trøstestav,","At ved din oppreisnings ære","Jeg skal seiers palmer bære."],["Du til livet meg skal vekke,","Det er din oppreisnings kraft;","La kun jordens støv meg dekke,","Ormer tære all min saft,","Ild og vann oppsluke meg,","Dog jeg dør i tro til deg","At jeg skal til liv oppstande","Av de grumme dødens lande."],["Herre Jesus, gi meg nåde","Ved din gode Hellig Ånd","At jeg så min gang kan råde","Og veiledes ved din hånd","At jeg ei skal falle hen","I det dødens svelg igjen","Hvorav du meg engang rykte","Da du døden undertrykte."],["Takk for all din fødsels glede,","Takk for ditt det guddoms ord,","Takk for dåpens hellig væte,","Takk for nåden på ditt bord!","Takk for dødens bitre ve,","Takk for din oppstandelse,","Takk for himlen du har inne,","Der skal jeg deg se og finne."]],"tittel":"Som den gylne sol frembryter"},{"nr":153,"seksjon":"Påske","vers":[["Å fikk jeg kun være den minste kvist","På vintreet ditt, Herre Jesus Krist!","Og måtte så aldri vi skilles igjen,","Men elske og elskes som venn hos venn!"],["Din saft er flytt meg i årene inn,","Jeg knelte og drakk av nadverdens vin;","Hvor kvegtes min ånd, som før var matt,","Ved himmelduggen skjærtorsdags natt!"],["Vi ranker oss sammen, vi vinkvister små,","Som brødre og søstre om Jesus å stå.","Akk la ingen visne av våre, o Gud,","Ei brytes av stammen og ei kastes ut."],["Du rense mitt hjerte med ømmeste tukt,","Og bløder enn grenen, den bærer dog frukt.","Du mener det godt med mitt dryppende sår,","Du har meg så kjær, og du best det forstår."],["Ja, får jeg kun være den minste kvist","På vintreet ditt, Herre Jesus Krist!","Ditt kors rankes inn av de vinkvister små,","Og opp til ditt hjerte jeg gjerne vil nå."]],"tittel":"Å fikk jeg kun være den minste kvist"},{"nr":154,"seksjon":"Påske","vers":[["Å salige stund uten like,","Han lever, han lever ennu!","Han vandrer i seierens rike,","Min sjel, hvorfor sørger da du?","Han er ikke lenger i graven,","Hvor bleknet i døden han lå,",":/: Jeg levende så ham i haven,","Og aldri så skjønn jeg ham så. :/:"],["Han lever, og jeg skal få bringe","Hans venner det salige ord -","Tenk, jeg som er ringest blant ringe,","Den minste han kjenner på jord.","Tenk, jeg skal hans hilsen frembære,","Å kunne jeg synge det ut!",":/: Mer kunne ei engler begjære,","Enn gå med så salig et bud. :/:"],["Å salige stund uten like,","Han lever, han lever ennu!","Han vandrer i seierens rike,","Min sjel, hvorfor sørger da du?","Du søkte din trøst i den døde,","Og dvelte ved gravnatten kun,",":/: Så fikk du den levende møte,","Å salige, salige stund! :/:"]],"tittel":"Å salige stund uten like"},{"nr":155,"seksjon":"Pinse","vers":[["Apostlene satt i Jerusalem","Og biet på Herrens time,","For øre da bratt det ringet dem","Som tusene klokker kime."],["Det rørte dem alle så underlig,","Det var ikke før opplevet;","Der taltes om dem i himmerik,","Der ble deres navn oppskrevet."],["Der taltes om dem som livets ord","Nu skulle med kraft forkynne,","Om himmelgleden ved Herrens bord,","Som skulle på jord begynne."],["Da hørtes på Sion der sus og brus,","Guds time, nu var den slagen!","Med kraft fra det høye det lave hus","Oppfyltes på pinsedagen."],["Da såes der tunger som ild og glød,","Guds venner de fløy i munnen;","På alle folks tunger Guds ord gjenlød,","Mangfoldig, dog ens i grunnen."],["Så tendtes på jorden det lys fra Gud","Der siden som sol har strålet,","Hvor levende røster Guds nådes bud","Forkynte på modersmålet."],["Og har vi til nu på det store ord","Som barnene små kun stammet,","Av himmelens ild som kom til jord,","Vi har dog en gnist annammet."],["Den gnist den lever hos oss ennu,","Oppblusser og i Guds time;","Så gladelig rinner det oss i hu","At himmeriks klokker kime."]],"tittel":"Apostlene satt i Jerusalem"},{"nr":156,"seksjon":"Pinse","vers":[["Kom Hellig Ånd med skapermakt,","Opprett hva synd har ødelagt,","Og glede i hvert hjerte giv","Som du har født til evig liv!"],["En trøsters store navn du bær,","Guds gave dyr og hjertens kjær,","Den syke sjel en salve mild,","En livets brønn, en hellig ild."],["Du visdoms, råds og styrkes Ånd,","Du kraften av Guds høyre hånd,","Du lysets bærer, Guds ords tolk","For alle tungemål og folk!"],["Ditt lys opptenn i vår forstand,","I hjertet kjærlighetens brann,","Til vanmakt vår og usseldom","Med hellig hjertestyrke kom!"],["Vår fiende, jag ham langt på flukt,","Gi fred og fager troes frukt,","Og la oss alle, store, små,","I sjeleomsorg hos deg stå!"],["Gjør oss med Gud vår Fader kjent,","Med Sønnen som han har utsendt,","Med deg som fra dem begge går,","Og hjelp at vi i troen står!"],["Vær lovet, Gud vår Fader god,","Guds Sønn som opp av døde stod,","Og Trøsteren som kom herned,","Vær lovet i all evighet!"]],"tittel":"Kom Hellig Ånd med skapermakt"},{"nr":157,"seksjon":"Konfirmasjon","vers":[["La denne dag, o Herre Gud, For oss velsignet være!","Fra nådens favn støt ingen ut Av disse våre kjære!","Du ser oss for deg stå, Vi beder, store, små:","Se, Fader, til oss ned, Lys over oss din fred","Og la din Ånd oss styrke!"],["Sign ordet i de unges munn, Dets kraft i hjertet brenne,","At de vår tro og troens grunn Sannferdig må bekjenne!","Engang de bares frem, Og du velsignet dem,","Du tok de små i favn, De døptes i ditt navn,","O kjennes ved dem, Herre!"],["La dem som feste vil sin pakt, Ditt faderhjerte finne,","Og la det ja som her blir sagt, Dem aldri gå av minne!","Men svak er dog enhver Til strid mot helveds hær,","Styrk ved din allmakts hånd Hver ærlig sjel og ånd","Til enden tro å blive!"],["Engang de ut fra fedrebo Omkring i verden vanker,","Da være dåp og kristen tro Det arme hjertes anker!","Vel den som sant får sagt: Jeg står med Gud i pakt!","Den vet seg ei forlatt Som håp til Gud har satt,","De faderløses Fader."]],"tittel":"La denne dag, o Herre Gud, For oss velsignet være"},{"nr":158,"seksjon":"Konfirmasjon","vers":[["De unge kristne knele ned,","For deg som hjertets tanker vet,","O Fader i det høye.","Med stille angers sukk i lønn:","Velsign og meg, er deres bønn.","Gi nåde for ditt øye.","Atter, De deg, Troskap sie,","Nåderike, Jesus Kriste","La det løfte aldri briste."],["O Fader, salv dem med din Ånd,","Opplys dem, led dem med din hånd.","På ordets rette veie.","O tenk på dem, o minnes dog.","Du skrev dem inn i livsens bok.","Til himlens arv og eie.","Er de, Falne, Av deg fundne,","Syndebundne, Deg miskunne.","Over dem som til deg stunde."],["Og vokt så, Jesus dine får,","I verdens ørken hvor de går.","I hunger, tørst og mørke.","Fra ungdom og til alder grå,","De fast hos deg i pakten stå,","Ved Åndens kraft og styrke.","Når da, Troen, Er bevaret,","Løpet faret, For din trone","Herre giv dem livsens krone."]],"tittel":"De unge kristne knele ned"},{"nr":159,"seksjon":"Konfirmasjon","vers":[["Jeg er frelst og dyrekjøpt","Og til saligheten døpt","I det guddomsnavn hvorved","Alle kne skal knele ned.","Blant Guds venner er jeg talt","Og til himmerike kalt","Ved hans Ånd som råder alt."],["Faderen har givet meg","Salig barnekår hos seg,","Min korsfested kjærlighet","Har sitt hoved bøyet ned","Og velsignet selv min sjel,","Gjennom tidens ve og vel","Er hans Ånd min trøst og del."],["Av mitt hjertes grunn jeg vil","Ham for evig høre til,","Med min styrkes Gud i pakt","Vil jeg ved hans nådes makt","Føre til min hånd er kold,","Åndens sverd og troens skjold","Mot all Satans list og vold."],["Vik, du mørkets fyrste, vik","Bort med all din løgn og svik!","Sjelen er av synden krenkt,","Men med Jesu blod besprengt.","Vik hver syndig lyst herfra!","Jeg har givet Jehova","Nu et evig, hellig ja!"],["Fader, Sønn og Hellig ånd,","Gi mitt forsett overhånd!","Hold meg ved din nådes makt","Alltid fast i dåpens pakt!","Så skal jeg, o kjærlighet,","Du mitt liv, min salighet,","Love deg i evighet!"]],"tittel":"Jeg er frelst og dyrekjøpt"},{"nr":null,"seksjon":"Tysfjordsangen","vers":[["Å, du Tysfjord med snøkledde tinder","og langs strendene oppdyrket jord","Bratte lier der bekkene rinner","og nedunder den glitrende fjord"],["Her har folket fra eldgamle dager","pløyet bølgen hver vinter og vår","Uten jammer og motløse klager","har de kjempet fra år og til år"],["Og når stormene pisket mot rute","og det suste om holmer og skjær","kjempet mang en i mørket der ute","og var tangsleipe sjøgraven nær"],["Ja, da lyste de lamper så ofte","fra et hjem langt der inne på strand","Og for dem som satt trette på tofte","sendtes bønnene opp i fra land"],["Men hver vår kom med solglans og glede","og det kvitret på fjell og i skog","Medens blomstene unge og spede","hilste trekkfuglens syngende tog"],["Da lå fjorden så vårstill og drømte","speilet tinder og grønnkledte strand","og sjøfuglene syngende svømte","frem til redene inne på land"],["Ja, da steg det en lovsang så vakker","fra et folk som på fjorden gled frem","Og det svarte fra lier og bakker:","Herren verne deg TYSFJORD, vårt hjem!"]],"tittel":"Tysfjordsangen","skjult":true,"nokkel":"t","merke":"T"},{"nokkel":"maria-smj","merke":"SMJ","gruppe":"maria","spraak":"Lulesamisk","tittel":"Maria, tjierrasis","merknad":["Julevsáme sálmmagirjje nr. 97","Tæksta: K.T. Andersen (1953-2010), Læstadiusa 1. bæssásjbiejve sárne jagen 1853 (nr. 195) milta.","Tjuojalvis: O. Paulsen 1996"],"vers":[["Maria, tjierrasis, gadnjalijs,","ij surgos dåbdå das suv.","Sån le gal tjábbat dal hållamin,","le Hærrá tjuodtjelam dal.","De tjiero, Maria, tjieruda,","gå i vuojne Hærrá mån lev.","Mån lev ham Jesus, guht´ hållamin.","I gus dån dåbbdå das´ muv?"],["Maria gielas dal dábddå suv","gå hoallá lidnásit sån.","De maná Maria, giehto dal,","le Hærrá tjuodtjelam gal!","Ale das', Maria, tieruda!","Mån ham Hærrá, tuodtjelam lev!","Mån lev ham Jesus, guht´ hållamin.","Gal gielas dabdåtja muv."],["Maria, namás duv gåhttjum lev","de håla Petrusij dal,","ja giehto ij dasti hávden le!","Ja ale tieruda das´","De javla, Maria, Petrusij,","de dal Hærrá tjuodtjelam le!","Mån lev ham Jesus, guht´ hållamin.","Gal dåbddåbihtte dal muv!"]],"nr":null,"seksjon":null,"skjult":true},{"nokkel":"maria-en","merke":"EN","gruppe":"maria","spraak":"Engelsk","tittel":"O Mary’s weeping","sokeord":["Maria"],"merknad":["Hymn Book no. 271","Text: K.T. Andersen (1953-2010), by Læstadius sermon First Easter Day Preached Year 1853.","Tune: O. Paulsen, 1996."],"vers":[["O Mary’s weeping, she doesn’t know,","Her friend beside Jesus’ grave","He tells her softly that Christ the Lord,","No longer lies in the cave,","So weep now, Mary, with sorrow’s tears.","If you cannot know your friend,","I speak to you, O Mary, hear,","My voice may you comprehend."],["O Mary, listen to Jesus’ voice,","He gently speaks to you dear.","So bring glad tidings of comfort now,","That I alive shall appear,","And weap no more, O Mary, now,","My voice softly testifies,","Your Lord’s arisen from where He lay,","I stand now before your eyes."],["O Mary, you are my witness now,","For I have called you by name,","So go to Peter, this message bear,","The empty grave there proclaim,","Yes, go to Peter with joyful news,","His lord is buried no more,","O stop your weeping Mary, hear:","I am your Savior and Lord."]],"nr":null,"seksjon":null,"skjult":true},{"nokkel":"maria-no","merke":"NO","gruppe":"maria","spraak":"Norsk","tittel":"Maria gråter","merknad":["Tekst: K.T. Andersen (1953-2010), etter Læstadius preken 1. påskedag i 1853 (nr. 195).","Melodi: O. Paulsen, 1996"],"vers":[["Maria gråter, hun kjenner ei,","sin venn ved Mesterens grav.","Han sier stille at Herren Krist,","i graven ikke er mer.","\"Så gråt, Maria, da sorgens gråt,","om du ikke kjenner din venn.","Jeg taler med deg, Maria hør,","min røst, du kjenner vel den?”"],["Maria lytter til Jesu røst,","hans milde stemme så kjær.","\"Så gå, Maria, med bud om trøst,","at jeg oppstanden nu er.","Og gråt ei mere, Maria hør,","at din Herre oppstanden er.","Min røst har gitt deg et vitnesbyrd:","Jeg står nu fremfor deg her.\""],["\"Maria, du er mitt vitne nu,","for jeg har nevnt deg ved navn.","Så gå til Peter med dette bud,","at jeg i graven ei er.","Ja gå til Peter med gledesbud","at hans Herre lever i dag.","Og gråt ei mere, Maria nu,","din Herre Jesus er jeg.\""]],"nr":null,"seksjon":null,"skjult":true},{"nokkel":"maria-sv","merke":"SV","gruppe":"maria","spraak":"Svensk","tittel":"Maria gråter","merknad":["Psalmbok nr. 370","Text: K.T. Andersen (1953-2010), efter Læstadiuspredikan första påskdagen 1853 (SW 26A).","Melodi: O. Paulsen, 1996"],"vers":[["Maria gråter, hon känner ej","Sin vän vid Mästarens grav.","Han säger stilla att Herren Krist","I graven inte är kvar.","\"Så gråt, Maria, då sorgens gråt","Om du inte känner din vän.","Jag talar med dig, Maria, hör","Min röst, nog känner du den?\""],["Maria lyssnar till Jesu röst,","Hans milda stämma så kär.","\"Så gå, Maria, med bud om tröst","Att jag uppstånden nu är.","Och gråt ej mera, Maria, hör","Att din Herre uppstånden är.","Min röst har gett dig ett vittnesbörd:","Jag står ju framför dig här.\""],["\"Maria, du är mitt vittne nu","Ty jag har nämnt dig vid namn.","Så gå till Petrus med detta bud","Att jag i graven ej fanns.","Ja gå till Petrus med glädjebud","Att hans Herre lever idag.","Och gråt ej mera, Maria, nu","Din Herre Jesus är jag”."]],"nr":null,"seksjon":null,"skjult":true},{"nokkel":"maria-fi","merke":"FI","gruppe":"maria","spraak":"Finsk","tittel":"Maria itkee","merknad":["Sanat: K.T. Andersen (1953-2010), Laestadiuksen 1. pääsiäispäivänä vuonna 1853 pitämän saarnan mukaan (P I-I 437, S I-III 104).","Sävel: O. Paulsen, 1996"],"vers":[["Maria itkee, hän tunne ei,","Ken haudall' Mestarin on.","Hän kertoo Kristuksen lähteneen","On hauta asumaton.","\"Niin itke, Maria, murheessas’","Jos et tunne ystävääsi.","Mä puhun kanssasi, kuulethan,","Onhan tää tuttu ääni?\""],["Maria kuuntelee Jeesusta,","ääntänsä autuasta.","\"Niin vie, Maria, sanoma tää,","Mä nousin haudasta.","Nyt itku lakkaa, siis kuuntele,","Ylösnoussut on Herrasi sun.","Ääneni sinulle todisti:","Nyt olet kanssani mun.”"],["\"Oot todistajani, Maria,","mä sulle puhunut oon.","Mene tapaamaan Pietaria","Kerro, en haudassa oo.","Vie Pietarille se sanoma,","On Herrasi ilmestynyt.","Ja älä itke sä Maria,","Tässä on Herrasi nyt.\""]],"nr":null,"seksjon":null,"skjult":true}]}</script>

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var SONGS = DATA.sanger;
  var MAX_HITS = 200;
  var MAX_RECENT = 10;
  var SIZES = [16, 18, 21, 24, 28, 32, 38];

  // localStorage kan mangle eller kaste unntak (privat modus, blokkert lagring). Appen virker uansett.
  var store = {
    get: function (key, fallback) {
      try {
        var value = localStorage.getItem(key);
        return value === null ? fallback : JSON.parse(value);
      } catch (e) { return fallback; }
    },
    set: function (key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
  };

  // Normalisering for søk. Gir samme lengde som teksten, slik at treff kan utheves på riktig sted:
  // små bokstaver, svensk ö/ä likt norsk ø/æ, og alt som ikke er bokstav eller siffer blir mellomrom.
  function fold(s) {
    return s.toLowerCase().replace(/ö/g, "ø").replace(/ä/g, "æ").replace(/[^0-9a-zæøåéèêüóòáà]/g, " ");
  }
  function words(s) { return fold(s.normalize("NFC")).split(" ").filter(Boolean); }

  // Forbered sangene: nøkkel, linjer med søketekst, og samlet tekst for frasesøk.
  // Skjulte sanger (Tysfjordsangen) er med i søket, men ikke i innholdet eller når man blar.
  var BROWSE = SONGS.filter(function (song) { return !song.skjult; });
  BROWSE.forEach(function (song, i) { song.pos = i; });
  function neighbour(song, d) { return song.skjult ? null : BROWSE[song.pos + d] || null; }

  var byKey = {};
  SONGS.forEach(function (song, i) {
    song.index = i;
    song.key = song.nokkel || String(song.nr);
    byKey[song.key] = song;
    song.lines = [];
    song.vers.forEach(function (verse, v) {
      verse.forEach(function (text) { song.lines.push({ text: text, f: fold(text), v: v }); });
    });
    song.flat = " " + words(song.lines.map(function (l) { return l.text; }).join(" ")).join(" ") + " ";
    song.titleFlat = " " + words([song.tittel].concat(song.sokeord || []).join(" ")).join(" ") + " ";
    // Seksjon/språk og ekstra søkeord (f.eks. «Maria» for den engelske «O Mary’s weeping») gir også treff.
    song.secFlat = " " + words([song.seksjon || song.spraak || ""].concat(song.sokeord || []).join(" ")).join(" ") + " ";
  });

  var input = document.getElementById("q");
  var home = document.getElementById("home");
  var statusEl = document.getElementById("status");
  var list = document.getElementById("results");
  var songEl = document.getElementById("song");
  var songBody = document.getElementById("song-body");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function label(song) { return song.merke || String(song.nr); }

  function search(query) {
    var q = words(query);
    if (!q.length) return { q: q, hits: [] };
    var phrase = " " + q.join(" ");
    var numberOnly = /^\d+$/.test(query.trim());
    var hits = [];
    SONGS.forEach(function (song) {
      var score = 0;
      if (numberOnly && String(song.nr) === query.trim()) score = 1000;
      // Alle ordene må finnes i sangen (som begynnelsen av et ord, eller inni et ord).
      var all = q.every(function (w) { return song.flat.indexOf(w) !== -1 || song.secFlat.indexOf(" " + w) !== -1; });
      if (all) {
        score += 10;
        if (song.flat.indexOf(phrase) !== -1 || song.secFlat.indexOf(phrase + " ") !== -1) score += 40;
        if (song.titleFlat.indexOf(phrase) === 0) score += 100;
        else if (song.titleFlat.indexOf(phrase) !== -1) score += 30;
        q.forEach(function (w) { if (song.flat.indexOf(" " + w) !== -1) score += 5; });
      }
      if (score) hits.push({ song: song, score: score });
    });
    hits.sort(function (a, b) { return b.score - a.score || a.song.index - b.song.index; });
    return { q: q, hits: hits };
  }

  // Finn linjen som best viser hvorfor sangen traff: helst hele frasen, ellers flest av ordene.
  function bestLine(song, q) {
    var best = null, bestScore = 0;
    var phrase = q.join(" ");
    song.lines.forEach(function (line) {
      var squeezed = line.f.replace(/ +/g, " ");
      var s = squeezed.indexOf(phrase) !== -1 ? 100 : 0;
      q.forEach(function (w) { if (line.f.indexOf(w) !== -1) s += 1; });
      if (s > bestScore) { best = line; bestScore = s; }
    });
    return best;
  }

  // Uthev søkeordene i en tekst. Ordene matches mot den normaliserte teksten (samme lengde).
  function highlight(text, q) {
    var frag = document.createDocumentFragment();
    if (!q || !q.length) { frag.appendChild(document.createTextNode(text)); return frag; }
    var f = fold(text);
    var marks = [];
    q.forEach(function (w) {
      for (var at = f.indexOf(w); at !== -1; at = f.indexOf(w, at + 1)) marks.push([at, at + w.length]);
    });
    marks.sort(function (a, b) { return a[0] - b[0]; });
    var pos = 0;
    marks.forEach(function (m) {
      if (m[0] < pos) { if (m[1] > pos) m[0] = pos; else return; }
      frag.appendChild(document.createTextNode(text.slice(pos, m[0])));
      var el = document.createElement("mark");
      el.textContent = text.slice(m[0], m[1]);
      frag.appendChild(el);
      pos = m[1];
    });
    frag.appendChild(document.createTextNode(text.slice(pos)));
    return frag;
  }

  function hitItem(song, q, snippetLine) {
    var li = document.createElement("li");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "hit";
    var nr = document.createElement("span");
    nr.className = "nr";
    nr.textContent = label(song);
    var body = document.createElement("span");
    body.className = "body";
    var title = document.createElement("span");
    title.className = "title";
    title.appendChild(highlight(song.tittel, q));
    body.appendChild(title);
    if (snippetLine && snippetLine.text !== song.vers[0][0]) {
      var sn = document.createElement("span");
      sn.className = "snippet";
      sn.appendChild(document.createTextNode((snippetLine.v + 1) + ". vers: "));
      sn.appendChild(highlight(snippetLine.text, q));
      body.appendChild(sn);
    }
    btn.appendChild(nr);
    btn.appendChild(body);
    btn.addEventListener("click", function () {
      openSong(song, q);
    });
    li.appendChild(btn);
    return li;
  }

  function sectionHead(title, right, onRight) {
    var head = document.createElement("div");
    head.className = "section-head";
    var h = document.createElement("h2");
    h.textContent = title;
    head.appendChild(h);
    if (right && onRight) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "link-btn";
      btn.textContent = right;
      btn.addEventListener("click", onRight);
      head.appendChild(btn);
    } else if (right) {
      var span = document.createElement("span");
      span.textContent = right;
      head.appendChild(span);
    }
    return head;
  }

  function getRecent() {
    var r = store.get("sistesanger", []);
    // Skjulte sanger skal ikke vises på forsiden, heller ikke under «Sist åpnet».
    return Array.isArray(r) ? r.filter(function (k) { return byKey[k] && !byKey[k].skjult; }) : [];
  }
  function addRecentSong(song) {
    if (song.skjult) return;
    var r = getRecent().filter(function (k) { return k !== song.key; });
    r.unshift(song.key);
    store.set("sistesanger", r.slice(0, MAX_RECENT));
  }

  // Startsiden (tomt søkefelt): siste sanger, hopp til seksjon, og alle sangene sortert etter nummer.
  function renderHome() {
    home.textContent = "";
    list.textContent = "";
    statusEl.textContent = "";

    var recent = getRecent();
    if (recent.length) {
      home.appendChild(sectionHead("Sist åpnet", "Tøm", function () { store.set("sistesanger", []); render(); }));
      var chips = document.createElement("div");
      chips.className = "chips";
      recent.forEach(function (key) {
        var song = byKey[key];
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        var b = document.createElement("b");
        b.textContent = label(song);
        chip.appendChild(b);
        chip.appendChild(document.createTextNode(song.tittel));
        chip.addEventListener("click", function () { openSong(song); });
        chips.appendChild(chip);
      });
      home.appendChild(chips);
    }

    home.appendChild(sectionHead("Innhold"));
    var toc = document.createElement("div");
    toc.className = "toc";
    DATA.seksjoner.forEach(function (sec, i) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = sec.navn;
      chip.addEventListener("click", function () {
        var target = document.getElementById("sec-" + i);
        if (target) window.scrollTo(0, target.getBoundingClientRect().top + window.pageYOffset - 90);
      });
      toc.appendChild(chip);
    });
    home.appendChild(toc);

    DATA.seksjoner.forEach(function (sec, i) {
      var nrs = sec.sanger.filter(function (n) { return n !== null; });
      var span = nrs.length ? nrs[0] + "–" + nrs[nrs.length - 1] : "";
      var head = sectionHead(sec.navn, span);
      head.id = "sec-" + i;
      home.appendChild(head);
      var ul = document.createElement("ul");
      ul.className = "results";
      sec.sanger.forEach(function (n) {
        ul.appendChild(hitItem(byKey[String(n)], null, null));
      });
      home.appendChild(ul);
    });
  }

  function render() {
    var query = input.value;
    if (!words(query).length) { renderHome(); return; }
    home.textContent = "";
    var result = search(query);
    var hits = result.hits;
    list.textContent = "";
    var frag = document.createDocumentFragment();
    hits.slice(0, MAX_HITS).forEach(function (h) {
      var numberHit = h.score >= 1000;
      frag.appendChild(hitItem(h.song, numberHit ? null : result.q, numberHit ? null : bestLine(h.song, result.q)));
    });
    list.appendChild(frag);
    if (!hits.length) {
      statusEl.textContent = "";
      var empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = /^\d+$/.test(query.trim())
        ? "Det finnes ingen sang nummer " + query.trim() + ". Sangene har nummer 1–" + DATA.seksjoner.reduce(function (m, s) { return Math.max.apply(null, [m].concat(s.sanger.filter(Number))); }, 0) + "."
        : "Ingen treff på «" + query.trim() + "».";
      list.appendChild(empty);
    } else {
      statusEl.textContent = hits.length + (hits.length === 1 ? " sang" : " sanger") +
        (hits.length > MAX_HITS ? ", viser de første " + MAX_HITS : "");
    }
  }

  // Repetisjonstegnet :/: vises tydelig i aksentfarge.
  function lineContent(text, q) {
    var frag = document.createDocumentFragment();
    text.split(/(:\/:)/).forEach(function (part) {
      if (part === ":/:") {
        var rep = document.createElement("span");
        rep.className = "rep";
        rep.setAttribute("aria-label", "gjentas");
        rep.textContent = ":/:";
        frag.appendChild(rep);
      } else if (part) {
        frag.appendChild(highlight(part, q));
      }
    });
    return frag;
  }

  function showSong(song, q) {
    songBody.textContent = "";
    var head = document.createElement("div");
    head.className = "song-head";
    var nr = document.createElement("span");
    nr.className = "big-nr";
    nr.textContent = song.nr === null ? "" : song.nr;
    var sec = document.createElement("span");
    sec.className = "sec";
    sec.textContent = song.seksjon || song.spraak || "";
    var h2 = document.createElement("h2");
    h2.id = "song-title";
    h2.textContent = (song.nr === null ? "" : "Sang " + song.nr + ": ") + song.tittel;
    head.appendChild(nr);
    head.appendChild(sec);
    head.appendChild(h2);
    songBody.appendChild(head);

    var ol = document.createElement("ol");
    ol.className = "verses";
    var verseNo = 0;
    var firstMark = null;
    song.vers.forEach(function (verse) {
      var li = document.createElement("li");
      var lines = verse.slice();
      var isKor = /^Kor\s*:/i.test(lines[0]);
      if (isKor) {
        li.className = "verse kor";
        var lab = document.createElement("span");
        lab.className = "label";
        lab.textContent = "Kor";
        li.appendChild(lab);
        lines[0] = lines[0].replace(/^Kor\s*:\s*/i, "");
      } else {
        li.className = "verse";
        verseNo += 1;
        if (song.vers.length > 1) {
          var vnr = document.createElement("span");
          vnr.className = "vnr";
          vnr.textContent = verseNo + ".";
          li.appendChild(vnr);
        }
      }
      lines.forEach(function (text) {
        var p = document.createElement("p");
        p.appendChild(lineContent(text, q));
        li.appendChild(p);
      });
      if (!firstMark) firstMark = li.querySelector("mark");
      ol.appendChild(li);
    });
    songBody.appendChild(ol);

    var nav = document.createElement("div");
    nav.className = "song-nav";
    [[-1, "prev", "‹ Forrige"], [1, "next", "Neste ›"]].forEach(function (d) {
      var other = neighbour(song, d[0]);
      var b = document.createElement("button");
      b.type = "button";
      b.className = d[1];
      b.disabled = !other;
      if (other) {
        var small = document.createElement("small");
        small.textContent = d[2] + " · " + label(other);
        var span = document.createElement("span");
        span.textContent = other.tittel;
        b.appendChild(small);
        b.appendChild(span);
        b.addEventListener("click", function () { goTo(other); });
      }
      nav.appendChild(b);
    });
    if (song.skjult) nav.style.display = "none"; // skjulte sanger har ingen forrige/neste
    songBody.appendChild(nav);

    // Samme sang på andre språk.
    var others = song.gruppe ? SONGS.filter(function (s) { return s.gruppe === song.gruppe && s !== song; }) : [];
    if (others.length) {
      songBody.appendChild(sectionHead("Andre språk"));
      var langs = document.createElement("div");
      langs.className = "chips";
      others.forEach(function (o) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        var b = document.createElement("b");
        b.textContent = o.spraak;
        chip.appendChild(b);
        chip.appendChild(document.createTextNode(o.tittel));
        chip.addEventListener("click", function () { goTo(o); });
        langs.appendChild(chip);
      });
      songBody.appendChild(langs);
    }

    var source = document.createElement("p");
    source.className = "source";
    if (song.merknad) {
      song.merknad.forEach(function (text, i) {
        if (i) source.appendChild(document.createElement("br"));
        source.appendChild(document.createTextNode(text));
      });
    } else if (!song.skjult) {
      source.textContent = DATA.meta.tittel + " (" + DATA.meta.aar + ").";
    }
    if (source.firstChild) songBody.appendChild(source);
    if (song.skjult) {
      var outside = document.createElement("p");
      outside.className = "outside";
      outside.textContent = "Denne sangen er ikke en del av salmeboken «" + DATA.meta.tittel + "».";
      songBody.appendChild(outside);
    }

    prevBtn.disabled = !neighbour(song, -1);
    nextBtn.disabled = !neighbour(song, 1);
    document.title = (song.nr === null ? "" : song.nr + ". ") + song.tittel + " – Sangbok";
    songEl.hidden = false;
    songEl.scrollTop = 0;
    // Hopp ned til første treff hvis det ikke er i første vers.
    if (firstMark && firstMark.getBoundingClientRect().top > window.innerHeight * 0.7) {
      songEl.scrollTop = firstMark.getBoundingClientRect().top - 140;
    }
    addRecentSong(song);
  }

  // Sangvisningen legges i nettleserhistorikken (#12), slik at tilbake-knapp og -sveip fungerer,
  // og adressen kan deles eller legges som bokmerke.
  var current = null;
  var pushed = false;
  function openSong(song, q) {
    if (!song) return;
    input.blur();
    current = { song: song, q: q || null };
    if (songEl.hidden) { history.pushState({ song: song.key }, "", "#" + song.key); pushed = true; }
    else history.replaceState({ song: song.key }, "", "#" + song.key);
    showSong(song, current.q);
  }
  function goTo(song) {
    current = { song: song, q: null };
    history.replaceState({ song: song.key }, "", "#" + song.key);
    showSong(song, null);
  }
  function closeSong() {
    songEl.hidden = true;
    pushed = false;
    current = null;
    document.title = DATA.meta.tittel;
    if (!words(input.value).length) renderHome();
  }

  window.addEventListener("popstate", function () {
    var key = location.hash.slice(1);
    if (byKey[key]) { current = { song: byKey[key], q: null }; showSong(byKey[key], null); }
    else closeSong();
  });
  document.getElementById("back").addEventListener("click", function () {
    if (pushed) history.back();
    else { history.replaceState(null, "", location.pathname + location.search); closeSong(); }
  });
  prevBtn.addEventListener("click", function () { var s = current && neighbour(current.song, -1); if (s) goTo(s); });
  nextBtn.addEventListener("click", function () { var s = current && neighbour(current.song, 1); if (s) goTo(s); });
  document.addEventListener("keydown", function (e) {
    if (songEl.hidden || e.target === input) return;
    if (e.key === "ArrowLeft") prevBtn.click();
    else if (e.key === "ArrowRight") nextBtn.click();
    else if (e.key === "Escape") document.getElementById("back").click();
  });

  // Tekststørrelse i sangvisningen, lagret på enheten.
  var sizeIndex = store.get("tekststorrelse", 2);
  if (!(sizeIndex >= 0 && sizeIndex < SIZES.length)) sizeIndex = 2;
  function applySize() {
    document.documentElement.style.setProperty("--song-size", SIZES[sizeIndex] + "px");
    document.getElementById("smaller").disabled = sizeIndex === 0;
    document.getElementById("bigger").disabled = sizeIndex === SIZES.length - 1;
    store.set("tekststorrelse", sizeIndex);
  }
  document.getElementById("smaller").addEventListener("click", function () { if (sizeIndex > 0) { sizeIndex--; applySize(); } });
  document.getElementById("bigger").addEventListener("click", function () { if (sizeIndex < SIZES.length - 1) { sizeIndex++; applySize(); } });
  applySize();

  var timer = null;
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { render(); window.scrollTo(0, 0); }, 120);
  });
  // Enter åpner sangen direkte når det bare er ett treff, eller når man har skrevet et sangnummer.
  input.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    clearTimeout(timer);
    render();
    var result = search(input.value);
    if (result.hits.length && (result.hits[0].score >= 1000 || result.hits.length === 1)) {
      var top = result.hits[0];
      openSong(top.song, top.score >= 1000 ? null : result.q);
    } else {
      input.blur();
    }
  });

  // Offline-støtte. Service workeren finnes bare når appen lastes fra en nettadresse, ikke som lokal fil.
  // Siden vises fra cache, så en ny versjon blir lastet ned i bakgrunnen. Når det finnes en cache
  // med en annen versjon enn denne siden, tilbyr vi å laste inn på nytt.
  var VERSION = "912046d0368c";
  function showUpdate() { document.getElementById("update").hidden = false; }
  function checkForUpdate() {
    caches.keys().then(function (keys) {
      var others = keys.filter(function (k) { return k.indexOf("sangbok-") === 0 && k !== "sangbok-" + VERSION; });
      if (others.length) showUpdate();
    }).catch(function () {});
  }
  if ("serviceWorker" in navigator && "caches" in window && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (e.data && e.data.type === "aktivert" && e.data.versjon !== VERSION) showUpdate();
    });
    navigator.serviceWorker.register("sw.js").catch(function () {});
    navigator.serviceWorker.ready.then(checkForUpdate);
    document.getElementById("reload").addEventListener("click", function () { location.reload(); });
  }

  // Testkrok for automatisk verifisering.
  window.sangbok = {
    search: function (q) { return search(q).hits.map(function (h) { return label(h.song) + " " + h.song.tittel; }); }
  };

  render();
  // Åpnet med #12 i adressen: vis sang 12 direkte, med startsiden under.
  var startKey = location.hash.slice(1);
  if (byKey[startKey]) {
    history.replaceState(null, "", location.pathname + location.search);
    openSong(byKey[startKey]);
  } else if (location.hash) {
    history.replaceState(null, "", location.pathname + location.search);
  }
})();
</script>
</body>
</html>
