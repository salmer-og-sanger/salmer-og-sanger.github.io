/* Samme tema som Læstadiansk prekensøk: mørkt blågrått med salviegrønn aksent. */
:root {
  --bg: #2a313b;
  --panel: #1c222b;
  --ink: #f2f4f7;
  --muted: rgba(242, 244, 247, 0.68);
  --none: rgba(242, 244, 247, 0.45);
  --line: #3a4452;
  --field-line: #4b5665;
  --accent: #9cc4b2;
  --accent-soft: rgba(156, 196, 178, 0.08);
  --hit-ink: #1c222b;
  --pressed: #252c36;
  --radius: 6px;
  --width: 760px;
  --song-size: 21px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.55 "Source Sans 3", "Source Sans Pro", -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }

lille hånd, hva du gjør!"],[":/: Vær forsiktig, lille fot, hvor du går! :/:","For vår far i himlen ser Alt som her på jorden skjer.","Vær forsiktig, lille fot, hvor du går!"],[":/: Vær forsiktig, lille hjerte, hva du tror! :/:","For vår far i himlen ser Alt som her på jorden skjer.","Vær forsiktig, lille hjerte, hva du tror!"]],"tittel":"Vær forsiktig, lille barn, hva du gjør!"},{"nr":14,"seksjon":"Barn","vers":[[":/: Vær meg nær, å Gud, vær meg nær. :/:","Å Gud, vær meg nær."],[":/: Når jeg gråter, Gud, vær meg nær :/:","Å Gud, vær meg nær."],[":/: Når jeg synger, Gud, vær meg nær :/:","Å Gud, vær meg nær."],[":/: Når jeg ber til deg, vær meg nær. :/:","Å Gud, vær meg nær."]],"tittel":"Vær meg nær, å Gud, vær meg nær."},{"nr":15,"seksjon":"Barn","vers":[["Min båt er så liten, Og havet så stort,","Men Jesus har grepet min hånd.",":/: Når han styrer båten, Da går det så bra","På veien til himmelens land. :/:"],["Så liten og ringe, På jorden jeg er,","Men Jesus meg hjelper hver dag.",":/: Hver morgen meg bønnen Til himmelen bær.","Jeg sovner hos Jesus hver kveld. :/:"]],"tittel":"Min båt er så liten, Og havet så stort"},{"nr":16,"seksjon":"Barn","vers":[["Kjære Far ta hånden min. Slipp den aldri ut av din.","Led meg på din vei i dag, Trygg og glad!"]],"tittel":"Kjære Far ta hånden min. Slipp den aldri ut av din"},{"nr":17,"seksjon":"Barn","vers":[["Kjære Gud, jeg har det godt.","Takk for alt som jeg har fått.","Du er god, du holder av meg.","Kjære Gud, gå aldri fra meg.","Pass på liten og på stor,","Gud bevare far og mor."]],"tittel":"Kjære Gud, jeg har det godt"},{"nr":18,"seksjon":"Barn","vers":[["Jeg vet en deilig have Hvor roser står i flor.","Den skapte Gud til gave For alle barn på jord."],["Hvert barn med tanker fromme Og øm og kjærlig sjel,","Får lov der inn å komme Og plukke roser selv."],["Så ber jeg deg å bøye Mitt hjerte og mitt sinn.","Gud Fader i det høye, Lukk meg i haven inn."]],"tittel":"Jeg vet en deilig have Hvor roser står i flor"},{"nr":19,"seksjon":"Barn","vers":[["Jeg vil være ærlig Mot min far og mor.","Jeg vil ikke lyve, Men si sanne ord."],["Jeg vil være ærlig. Gud jo allting vet.","Og så kan jeg ha en God samvittighet."]],"tittel":"Jeg vil være ærlig Mot min far og mor"},{"nr":20,"seksjon":"Barn","vers":[["Jeg er ei for liten Være barn av Gud.","Jeg er ei for liten Vandre i hans bud."],["Jeg er ei for liten Til Guds Ånd å ha.","Hjertet blir hans tempel. Salig er jeg da."],["Jeg er ei for liten Lyde mor og far.","Gud til dette budet Løfter givet har."],["Jeg er ei for liten Være lite lys,","Som om Jesus vitner Hvor anledning bys."],["Jesus, lær meg bede. Jesus, lær meg tro.","Jesus, lær meg elske, Elske slik som du."]],"tittel":"Jeg er ei for liten Være barn av Gud"},{"nr":21,"seksjon":"Barn","vers":[["Jeg er liten, men jeg vil Alltid høre Jesus til,","Han som hører meg og ser Når jeg ber."],["Jesus, du som er så god, Gav for meg ditt liv og blod.","La meg alltid ha deg kjær. Din jeg er."],["Jeg vil gjerne være snill, Får det ofte ikke til.","Når jeg syndet har mot deg, Tilgi meg."],["Og når jeg en gang blir stor Og skal bort fra far og mor,","La meg gå i Jesu spor Her på jord."]],"tittel":"Jeg er liten, men jeg vil Alltid høre Jesus til"},{"nr":22,"seksjon":"Barn","vers":[["Jeg folder mine hender små I takk og bønn til deg.","La alle barn i verden få Det like godt som jeg."],["Vern alle med din sterke hånd Mot fattigdom og død.","Og hjelp små barn i alle land Så ingen lider nød."],["La ingen krig og sult og sott Få gjøre oss fortred.","La alle leve trygt og godt I frihet og i fred."]],"tittel":"Jeg folder mine hender små I takk og bønn til deg"},{"nr":23,"seksjon":"Barn","vers":[["Jeg løfter øyet mot himmelen","Og folder mine hender.","Til deg, o Gud, som er barnets venn,","Min bønn og tanke jeg sender."],["Hold over oss din sterke hånd,","O Fader uten like,","Og la meg vokse for livets land,","Som er ditt himmelske rike!"]],"tittel":"Jeg løfter øyet mot himmelen"},{"nr":24,"seksjon":"Barn","vers":[["I ditt dyrebare navn","Går vi til vår gjerning, Jesus kjære.","La den være deg til ære,","La den trives til vårt gavn!"],["Du som åpnet oss din favn,","Du som ville våre synder bære,","La din lære for oss være","Livets lys til himlens havn!"]],"tittel":"I ditt dyrebare navn"},{"nr":25,"seksjon":"Barn","vers":[["I Østen stiger solen opp,","Den spreder gull på sky,","Går over hav og bergetopp,","Går over land og by."],["Den kommer fra den fagre kyst","Hvor paradiset lå,","Den bringer lys og liv og lyst","Til store og til små."],["Den hilser oss fra livets hjem,","Hvor først Guds lys opprant","Med stjernen over Betlehem,","Som Østens vise fant."],["Og med Guds sol utgår fra øst","En himmelsk glans på jord,","Et glimt fra paradisets kyst,","Hvor livets palme gror."],["Du solers sol fra Betlehem,","Ha takk og lov og pris","For hvert et glimt fra lysets hjem","Og fra ditt paradis!"]],"tittel":"I Østen stiger solen opp"},{"nr":26,"seksjon":"Barn","vers":[["Herre Jesus, la meg få","Være en av dine små,","En av dem som du velsigner,","Og som mer og mer deg ligner.","Alltid gå i dine spor,","Alltid lyde dine ord."],["Hjelp meg mens jeg vandrer her,","Deg å leve riktig nær,","At mitt hele liv må være","Deg til ære, Frelser kjære,","Så at andre og må få","Lyst til samme vei å gå"],["Jesus Krist, gjør flokken stor,","Samle inn fra syd og nord,","Samle inn fra hedninglande.","Vis dem vei, den ene, sanne","Som til himlen sikkert bær.","Veien, livet selv du er."]],"tittel":"Herre Jesus, la meg få"},{"nr":27,"seksjon":"Barn","vers":[["Gud er min Far - jeg er hans barn.","Det er så godt og trygt.","Jeg vet at han bevarer meg","Fra allting ondt og stygt."],["Når natten kommer, tenner han","Små stjerner i det blå.","Og blir det mørkt så vet jeg jo","At engler passer på."]],"tittel":"Gud er min Far - jeg er hans barn"},{"nr":28,"seksjon":"Barn","vers":[["Gud som har oss småbarn kjær,","Se til meg som liten er.","Hjelp meg denne dag å være","Snill og god, deg Gud til ære."],["Gud bevar vår hele jord,","Mine søsken, far og mor,","La din englevakt beskytte","Store, små i hus og hytte."]],"tittel":"Gud som har oss småbarn kjær"},{"nr":29,"seksjon":"Barn","vers":[["Alt er skapt av deg, o Gud,","Ved din makt og på ditt bud,","Luft og lys og sjø og land,","Fugl i skog og fisk i vann."],["Blomst på mark og frukt på tre,","Sol og regn og vind og sne,","Hver en ting av stort og smått","Har du skapt og skapt det godt."]],"tittel":"Alt er skapt av deg, o Gud"},{"nr":30,"seksjon":"Barn","vers":[["Ha takk, o Gud for dagen som skinner lys og klar,","Ha takk fordi du gav meg så snill en mor og far,","Ha takk fordi vi alle får være dine barn!","Så holder du om oss i dag din sterke faderarm."]],"tittel":"Ha takk, o Gud for dagen som skinner lys og klar"},{"nr":31,"seksjon":"Barn","vers":[["Gud vil jeg skal være et solskinnsbarn","Og lyse for ham hver dag,","I hjem og på skolen, i all min lek","Ham være til velbehag."],["Kor: Et solskinnsbarn, et solskinnsbarn,","Gud vil jeg skal være et solskinnsbarn.","Et solskinnsbarn, et solskinnsbarn,","Ja, det vil jeg være for ham."],["Gud vil jeg skal være så hjertens god","Og snill mot alle her,","Og vise hvor glad og fornøyet","Hans lille barn dog er."],["Jeg Jesus vil bede at han meg må","Bevare fra synd og skam,","Og hjelpe meg alltid å huske på","At jeg skal lyse for ham."],["Jeg ønsker å være hans solskinnsbarn.","Ja lyse jeg gjerne vil,","Og følge med Jesus i all min tid,","Så hører jeg himlen til."]],"tittel":"Gud vil jeg skal være et solskinnsbarn"},{"nr":32,"seksjon":"Barn","vers":[["Det er trygt å være Jesu lille lam.","Han vil lammet bære. Jeg vil følge ham."],["Det er godt å være Jesus, barnet ditt,","For da vil du bære Meg til hjemmet mitt."]],"tittel":"Det er trygt å være Jesu lille lam"},{"nr":33,"seksjon":"Barn","vers":[["Ditt barn eg no vil vera, Min Gud og Fader god!","Din vilje vil eg gjera, Lær meg ditt ord og bod!","Ber meg på dine hender, Vis meg den rette veg,","So kvar eg foten vender, Eg alltid fylgjer deg!"]],"tittel":"Ditt barn eg no vil vera, Min Gud og Fader god"},{"nr":34,"seksjon":"Barn","vers":[["Boken om Jesus er boken for meg.","Der møter Gud meg og viser meg vei.","Bibelen passer for liten og stor.","Alle som vil, kan få hjelp av Guds ord."],["Mange slags mennesker møter jeg der,","Meget å lære jeg har av enhver.","Gud er allmektig, og han er min Far.","Kjærligste omsorg for barna han har."],["Jesus, ja Jesus er kjærest for meg.","Tenk, han var engang et barn slik som jeg,","Og han forstår meg og elsker meg så","At han i døden for meg ville gå."],["Glad kan jeg lese om himmelens hjem,","Målet som venter den dag jeg når frem.","Ja, jeg vil følge min frelser, min bror,","Til jeg får møte ham der hvor han bor."]],"tittel":"Boken om Jesus er boken for meg"},{"nr":35,"seksjon":"Barn","vers":[["Det blir noe for barna i himlen å få,","For de barn som i Herren får dø.","De får kroner av gull, de får harper også,","De får kleder så hvite som snø."],["Kor: Det blir noe å få, det blir noe å få,","Det blir noe for barna å få.","I den himmelske stad,","Der hvert hjerte er glad.","Det blir noe for barna å få."],["De får vandre omkring på de gater av gull,","De får synge med englene der.","De får skue Guds lam som tok bort deres skyld,","De får se ham så skjønn som han er."],["De får sitte til bords i Guds herlighets sal,","De får ete det levende brød.","Lammet lyser iblant dem så klar som krystall,","Hverken natt finnes der eller død."],["De får drikke av elven som renner forbi,","De får nyte Guds salige trøst.","De får synge Guds lov på en ny melodi,","De får hvile ved Frelserens bryst."]],"tittel":"Det blir noe for barna i himlen å få"},{"nr":36,"seksjon":"Barn","vers":[["Herre, signe du og råde Og bevare nu oss vel!","Herre, la ditt åsyns nåde Alltid lyse for vår sjel!","Herre Gud, deg til oss vend Og din fred oss alle send!","Fader, Sønn og Ånd til sammen Være med oss alle!","Amen."]],"tittel":"Herre, signe du og råde Og bevare nu oss vel"},{"nr":37,"seksjon":"Barn","vers":[["Her samles vi omkring ditt ord","Som barn omkring sin Faders bord,","Og ber deg, Herre Jesus kjær:","Kom inn til oss, og hos oss vær."],["Å Herre, tal, vi høre vil,","Og gi oss det vi trenger til.","Forlat vår synd for Jesu blod.","Din Hellig Ånd la hos oss bo."],["Hold om vårt øye, øre vakt,","Og ta vårt hjerte vel i akt,","Så våre tanker ikke må","Fra deg og ut i verden gå."],["Vi ber deg nå av hjertens grunn:","Velsign du denne andakts-stund,","Og mett vår sjel med livsens brød,","Så svinner all vår sorg og nød."]],"tittel":"Her samles vi omkring ditt ord"},{"nr":38,"seksjon":"Barn","vers":[["Ingen er så trygg i fare,","Som Guds lille barneskare,","Fuglen ei i skjul bak løvet,","Stjernen ei høyt over støvet."],["Herren selv vil sine berge,","Han er deres skjold og verge,","Over dem han seg forbarmer,","Bærer dem på faderarmer."],["Ingen nød og ingen lykke,","Skal av Herrens hånd dem rykke.","Han den beste venn blant venner,","Sine barns bekymring kjenner."],["Våre hodehår han teller,","Hver en tåre som vi feller.","Han oss føder, han oss kleder,","Midt i sorgen han oss gleder."],["Gled deg da, du lille skare!","Jakobs Gud skal deg bevare.","For hans allmakts ord må alle,","Fiender til jorden falle."],["Hva han tar og hva han giver,","Samme Fader han forbliver,","Og hans mål er dette ene,","Barnets sanne vel alene."]],"tittel":"Ingen er så trygg i fare"},{"nr":39,"seksjon":"Barn","vers":[["Jesus, styr du mine tanker,","Jesus la meg leve så","At hvor jeg i verden vanker,","Et Guds barn jeg være må!","At hver stund jeg ånde drager","Gud til ære, meg til gavn,","Og så dør når ham behager,","I det søte Jesu navn!"]],"tittel":"Jesus, styr du mine tanker"},{"nr":40,"seksjon":"Barn","vers":[["Milde Jesus du som sagde","At til deg skal barnet gå,","Du som hender på dem lagde,","Ennu signer du de små.","Selv du blev til Herrens tempel","Båret i din moders favn,","La meg minnes ditt eksempel","Når jeg minnes om ditt navn."],["Du til dåpen lot meg kalle","Da jeg var en liten knopp,","Skal jeg visne? Skal jeg falle?","Hjelp meg du å vokse opp!","Hjelp meg du å tidlig lære","Og å elske Herrens ord,","Så engang blant dine kjære","Jeg kan knele ved ditt bord!"],["Når jeg så skal ut i verden,","Aldri jeg alene er,","Villgress vokser titt på ferden,","Men du ser hva jeg ei ser.","La meg gå min gang til gammen","All min tid for far og mor,","La oss bli i himlen sammen","Vi som var det her på jord!'"]],"tittel":"Milde Jesus du som sagde"},{"nr":41,"seksjon":"Barn","vers":[["Skriv deg, Jesus, på mitt hjerte,","Du min konge og min Gud,","At ei lyst, ei heller smerte","Deg formår å slette ut!","Denne innskrift på meg sett:","Jesus ut av Nasaret,","Den korsfestede, min ære","Og min salighet skal være."]],"tittel":"Skriv deg, Jesus, på mitt hjerte"},{"nr":42,"seksjon":"Barn","vers":[["Bli barn igjen på Jesu ord,","Da skal du visst fornemme","Det lyder enn til oss på jord","En kjærlig faderstemme.","Den sier: Frykt kun ei, men tro","Du skal hos meg i himlen bo,","Og der har gleden hjemme."]],"tittel":"Bli barn igjen på Jesu ord"},{"nr":43,"seksjon":"Barn","vers":[["Her er Guds hus og himlens port,","Herfra det går en stige,","Av ord og sakramenter gjort,","Helt opp til himmerike;","På den Guds engler treder inn,","Gud Fader selv på høyest trinn","Sin fred vil oss tilsige."],["Her er Guds hus og himlens port,","Og jeg det visste ikke.","Jeg sovet har de timer bort","Han bud meg ville skikke.","O vekk meg, vend fra jordens bo","Med Jakobs sterke håp og tro","Til himlen mine blikke!"],["Gud, send da dine engler ned,","La meg din røst få høre,","Lys over meg en hellig fred,","La fienden meg ei røre!","Jeg er en fattig vandringsmann,","Lov meg du til mitt fedreland","Vil frelst meg arme føre!"]],"tittel":"Her er Guds hus og himlens port"},{"nr":44,"seksjon":"Barn","vers":[["Herre Gud, ditt dyre navn og ære","Over verden høyt i akt skal være,","Og alle sjele,","De trette træle,","Alt som har mæle,","De skal fortelle din ære."],["Gud er Gud, om alle land lå øde,","Gud er Gud, om alle mann var døde.","Om slekter svimler","Blant stjernestimler","I høye himler","Utallig vrimler Guds grøde."],["Høye hall og dype dal skal vike,","Jord og himmel falle skal tillike,","Hvert fjell, hver tinde","Skal brått forsvinne,","Men opp skal rinne,","Som solen skinne Guds rike!"]],"tittel":"Herre Gud, ditt dyre navn og ære"},{"nr":45,"seksjon":"Barn","vers":[["Kjærlighet fra Gud Springer like ut","Som en kilde klar og ren. I dens stille bunn,","I dens dype grunn Gjemmes livets edelsten."],["Kjærlighet fra Gud Som en yndig brud","Kommer smykket til oss ned. Lukk kun opp din favn,","Kom i Jesu navn, Himlen bringer den jo med!"],["Kjærlighet fra Gud Er det store bud,","Er det eneste jeg vet. Bli i kjærlighet,","Og du har Guds fred, Ti Gud selv er kjærlighet!"]],"tittel":"Kjærlighet fra Gud Springer like ut"},{"nr":46,"seksjon":"Barn","vers":[["Lover Herren! Han er nær","Når vi synger, når vi beder.","Samles i hans navn vi her,","Selv han midt iblant oss treder.","Lover Herren, gamle, unge,","Pris hans navn hver barnetunge!"],["Herre, vær oss evig nær!","Vær oss nær når solen rinner,","Og når sol og stjerneskjær","I den dype natt forsvinner!","La din Ånd ei fra oss vike","Til vi ser deg i ditt rike."]],"tittel":"Lover Herren! Han er nær"},{"nr":47,"seksjon":"Barn","vers":[["Guds ord, det er vårt arvegods,","Det våre barns skal være;","Gud, gi oss i vår grav den ros","Vi holdt det høyt i ære!","Det er vår hjelp i nød,","Vår trøst i liv og død;","O Gud, hvordan det går,","La dog mens verden står,","Det i vår ætt nedarves!"]],"tittel":"Guds ord, det er vårt arvegods"},{"nr":48,"seksjon":"Barn","vers":[["Give Gud jeg efterhånden","Med Guds nådes ord i favn","Og må blive sterk i ånden,","Vokse opp i Jesu navn,","Blive ham litt mere lik","Som kom ned fra himmerik,","Lære himmellivets seder,","Dele Jesu barnegleder!"]],"tittel":"Give Gud jeg efterhånden"},{"nr":49,"seksjon":"Salmer og sanger","vers":[["Vår Gud han er så fast en borg,","Han er vårt skjold og verge,","Han hjelper oss av nød og sorg","Og vet oss vel å berge.","Vår gamle fiende hård","Til strid imot oss står,","Stor makt og arge list","Han bruker mot oss visst,","På jord er ei hans like."],["Vår egen makt er intet verd,","Vi var hel snart nedhugne;","Men en går frem i denne ferd,","For ham må all ting bugne.","Vil du hans navn få visst?","Han heter Jesus Krist,","Den høvding for Guds hær","I ham kun frelse er,","Han marken skal beholde."],["Om verden full av djevler var","Som ville oss oppsluke,","Vi frykter ei, vi med oss har","Den som Guds sverd kan bruke.","Er verdens fyrste vred","Og vil oss støte ned,","Han ingen ting formår","Fordi alt dømt han går,","Et Guds ord kan ham binde."],["Det ord de skal vel lade stå","Og utakk dertil have;","Ti Gud han selv vil med oss gå","Alt med sin Ånd og gave.","Og tok de enn vårt liv,","Gods, ære, barn og viv,","La fare hen, la gå!","De kan ei mere få,","Guds rike vi beholder."]],"tittel":"Vår Gud han er så fast en borg"},{"nr":50,"seksjon":"Salmer og sanger","vers":[["Ver eit solskin, unge kristen,","Ver eit solskin på din veg!","Då skal alltid himlens englar","På di livsferd fylgja deg.","Lat då Kristus, livsens-ljoset,","Vera soli i ditt liv,","Og det ljos du fær frå honom,","Stilt og audmjukt frå deg giv!"],["Ver eit solskin fyrst i heimen","Der du med dei kjære bur!","Alt du der i kjærleik ofrar","Gagnar meir enn sjølv du trur.","Kveik dei vesle barnevangar,","Kjærleik sårt dei veike treng,","Og strø solskinn yver vegen","Der små barneføter gjeng!"],["Vil du då eit solskin vera,","Unge kristen, kvar ein dag,","Skygg då ikkje med din skugge","For din Frelsars andletsdrag!","Nei lat honom vera soli,","Ver ein stråle berre du,","Då fær han åleine æra,","I ditt kall du då er tru."]],"tittel":"Ver eit solskin, unge kristen"},{"nr":51,"seksjon":"Salmer og sanger","vers":[["Hvor tamariskelundens dype, dunkle skygger,","Sitt mørke senker over Be-er-sabats grunn.","Hvor tjørnen blomstrer og hvor turtelduen bygger,","Der vandret Abraham en årle morgenstund.","Hans hjerte vånder seg for Gud, som hisset troner,","På jorden kneler han i stille ydmyk bønn.","Fra sjelens dyp fremveller klagesangens toner,","\"O Herre, vil du jeg skal ofre deg min sønn?\""],["Og Herrens stemme klart nu lyder til hans hjerte.","\"Ja, gi meg Isak, som du elsker og har kjær.","Vel koster ofret både gråt og bitter smerte,","Men jeg vil rikt belønne den som lydig er.\"","Så takker Abraham sin Gud i morgenrøden,","Hans hjerte fyltes med en stille liflig fred.","Han tenker: Gud oppreise kan min sønn fra døden.","Så drog med Isak han til Moria avsted."],["Og denne vandring var så tung, det var den siste,","Hvem kan vel fatte hva hans faderhjerte led.","Han så i ånden hvert et jordisk håp å briste,","Mens foten langsomt opp på bergets side skred.","Sitt hjertes håp han nu som offer skulle bringe,","Sin lille aftenblomst i livets sene høst.","Mot denne skatt var alt i verden ham så ringe,","Dog har han fred, for han har lydd sin Herres røst."],["Da taler Isak til sin far så blidt og stille","Mens han tålmodig på sin tunge byrde bar.","Hvor var de barneøyne elskelige milde,","Hvor var for Abraham han dyrebar og kjær?","\"Å, se min far her har vi ild og kniv og brenne,","Men hvor er lammet, som vi ofre skal til Gud?\"","Og svaret lyder: \"Dette lam vil Herren sende.","Ja offerlammet vil Jehova selv ta ut.\""],["Men kan vel Abraham den siste time glemme?","Han bygger alter, binder fast sin kjære sønn.","Han løfter kniven, men så hører han en stemme.","\"O, Abraham. Jeg er din meget store lønn.","Legg kniven bort og løs din sønn du måtte binde.","Nu har jeg sett du over all ting frykter Gud.\"","Og kniven faller, mens nu gledestårer rinner,","Fra hjertes fylde strømmer takk og lovsang ut."],["I samme stund oppløftet Abraham sitt øye,","Og se, en veder fast i tornebusken satt.","Den ofret han til Gud, Jehova i det høye,","Mens under gledestårer hjertet stille bad.","Da hørtes annen gang en engels røst fra himlen.","\"Du lød mitt bud, nu vil jeg rikt velsigne deg,","Lik sand ved verdenshavets bredd, lik stjernevrimlen","Vil jeg mangfoldiggjøre deg på jorderik.\""],["Når Isak ofret ble, har smertens tårer runnet,","Og Herrens berg ble håpets grav så mangen gang.","Men Åndens kjemper har den rette adel vunnet,","På offerhøyden under englers jubelsang.","Her ble en fyrste- og en presteslekt utkåret,","Her møter himlens drott sin dyrekjøpte brud,","Men ingen hellig har sitt kroningssmykke båret,","Før han på offerhøyden møttes med sin Gud."]],"tittel":"Hvor tamariskelundens dype, dunkle skygger"},{"nr":52,"seksjon":"Salmer og sanger","vers":[["Bekjenn kun fryktløst Jesu navn,","Om verden enn det skyr!","Det er en fjellgrunn og en havn","Når annet feste flyr."],["Å, skam deg ei ved Kristi ord","Om hele verden ler!","Guds veldes kraft for hver som tror","Det gamle budskap er."],["Fornekt ei Kristi kors! Det er","For verden dårskap kun,","For oss som har fått Herren kjær,","Det er vår frelses grunn."],["Bevar som sjelens største skatt","Hva Kristi godhet gav!","I livets dag, i dødens natt","Er han ditt lys, din stav."]],"tittel":"Bekjenn kun fryktløst Jesu navn"},{"nr":53,"seksjon":"Salmer og sanger","vers":[["Blott en dag, ett ögonblick i sänder,","Vilken tröst vad än som kommer på!","Allt ju vilar i min Faders händer,","Skulle jag, som barn, vel ängslas då?","Han som bär för mig en faders hjärta,","Giver ju åt varje nyfödd dag","Dess beskärda del av fröjd och smärta,","Möda, vila och behag."],["Själv han är mig alla dagar nära.","För var särskild tid med särskild nåd.","Varje dags bekymmer vill han bära,","Han som heter både Kraft och Råd.","Morgondagens omsorg får jag spara,","Om enn oviss syns min vandrings stig.","\"Som din dag, så skall din kraft och vara,\"","Detta löfte gav han mig."],["Hjälp mig då att vila tryggt och stilla","Blott vid dina löften, Herre kär,","Och ej trones dyra tröst förspilla,","Som i ordet mig förvarad er.","Hjälp mig, Herre, att vad helst mig händer,","Taga av din trogna fadershand","Blott en dag, ett ögonblick i sänder,","Tills jag nått det goda land."]],"tittel":"Blott en dag, ett ögonblick i sänder"},{"nr":54,"seksjon":"Salmer og sanger","vers":[["Bred dina vida vingar, O Jesus, över mig","Och låt mig stilla vila I ve och väl hos dig!","Bliv du mitt allt i alla, Min visdom och mitt råd,","Och låt mig alla dagar Få leva blott av nåd!"],["Förlåt mig alla synder Och två mig i ditt blod!","Giv mig ett heligt sinne, En vilja ny och god!","Tag i din vård och hägnad Oss alla, stora, små,","Och låt i frid oss åter Till nattens vila gå!"]],"tittel":"Bred dina vida vingar, O Jesus, över mig"},{"nr":55,"seksjon":"Salmer og sanger","vers":[["Brødre og søstre, nå skilles vi ad.","Far da med Jesus fornøyet og glad","Hver sine lovlige veier."],["Gjem nå Guds ord i ditt hjerte og sinn!","Lukk ikke synden og verden der inn!","Jesus la hjertene eie!"],["Amen, ja, Amen skal være vår sang.","Det vil vi synge med frydefull klang,","Alle Guds venner tilsammen."],["Lammet, ja, Lammet, dets vunder og sår","Æren og prisen i evighet får!","Amen, halleluja! Amen!"]],"tittel":"Brødre og søstre, nå skilles vi ad"},{"nr":56,"seksjon":"Salmer og sanger","vers":[["Den himmelske lovsang har rikere toner,","Mer liflig og sølvren en klang","Enn all jordisk musikk, skjønt vårt hjerte seg fryder","Når skogen og dalen gjenlyder av sang."],["Kor: Å herlige lovsang i Guds paradis","Når himlens hærskarer istemmer hans pris!"],["Hist oppe er sangen lik vannenes brusen,","Og himlen er full av dens lyd.","De salige ånder sin Frelser lovpriser,","De jubler av glede og synger av fryd."],["Kun de kan den himmelske lovsang istemme","Hvis sjel har fått nåde hos Gud","Ved troen på Jesus, sin Herre og Frelser,","Kun disse skal se ham og kalles hans brud."]],"tittel":"Den himmelske lovsang har rikere toner"},{"nr":57,"seksjon":"Salmer og sanger","vers":[["Du er innbudt til bryllup i himlen.","Du er ønsket velkommen av Gud.","Ja så riv deg da løs ifra vrimlen,","Kom i dag når Han sender deg bud."],["Kor: Du er innbudt til bryllup i himlen.","Det er du som skal være hans brud.","Ja så riv deg da løs ifra vrimlen.","Kom i dag når han sender deg bud."],["Hør min venn, si meg hva du vil svare","Nå når budet fra himlen deg når?","Vil du gjøre deg rede å fare?","Svare ja nå når budet deg når."],["Alt er ferdig, i himlen de venter.","Ja, de venter, de venter på deg.","Snart så kommer han selv ned og henter","De som går på den himmelske vei."]],"tittel":"Du er innbudt til bryllup i himlen"},{"nr":58,"seksjon":"Salmer og sanger","vers":[["Eg er ein gjest i verda, På reis som framand her.","Den trøyst eg har på ferda: Min heim i himlen er.","Langt bort om tiders strand Der strålar livsens land.","Eg er ein gjest i verda, Min heim i himlen er."],["Der har eg mine kjære, Der skal me møtast att","Og evig saman vera Ein dag forutan natt.","Der er min Frelsar god, Som flyta let sitt blod.","Eg er ein gjest i verda, Min heim i himlen er."],["Der finst ei gråt og kvida, Der finst ei sorg og nød,","Der slepp mitt hjarta lida, Der finst ei synd og død,","Der vert eg evig fri Og himlens gleda mi.","Eg er ein gjest i verda, Min heim i himlen er."],["Dit augo titt eg vender, I lengting hjarta skjelv,","Eg ser dei fagre strender Ved livsens klåre elv.","Han snart vil senda bud Og henta heim si brud.","Eg er ein gjest i verda, Min heim i himlen er."]],"tittel":"Eg er ein gjest i verda, På reis som framand her"},{"nr":59,"seksjon":"Salmer og sanger","vers":[["Et ungdomsliv er skjønt som morgenrøden","Når det kun leves rent i Herrens frykt.","Det knekkes ei av stormvær eller døden","Når det på klippen Jesus Krist er bygd."],["Ditt hjerteliv må fremfor alt bevares,","Din barnetro, ditt håp, din kjærlighet.","For alt engang det jo skal regnskap svares","Når dagens strid er slutt, og sol går ned."],["Når kan den unge livets sti bevare,","Så den er ren og lys ved dag og natt?","Det skjer alene når Guds ord, det klare,","Er lys og liv og fred og hjertets skatt."]],"tittel":"Et ungdomsliv er skjønt som morgenrøden"},{"nr":60,"seksjon":"Salmer og sanger","vers":[["Fager kveldsol smiler Over heimen ned,","Jord og himmel kviler Stilt i heilag fred."],["Berre bekken brusar Frå det bratte fjell,","Høyr, kor sterkt det susar I den stille kveld!"],["Ingen kveld kan læra Bekken fred og ro,","Ingi klokka bera Honom kvilebod."],["So mitt hjarta stundar Bankande i barm,","Til eg eingong blundar I Guds fader-arm."]],"tittel":"Fager kveldsol smiler Over heimen ned"},{"nr":61,"seksjon":"Salmer og sanger","vers":[["For Guds folk er hvilen tilbake","I himmelens salige hjem,","Bak trengselens skyfulle dage","En hviledag venter på dem."],["Her går de foraktet, har møye,","Anfektelser, strid og besvær.","Her gråter så titt deres øye,","De sukker: Akk var vi dog der."],["Dog midt under striden og nøden","Til Golgata søker de hen.","For han som for dem gikk i døden,","Er alltid den trofaste venn."],["De sier så ofte: Hør, vekter,","Er natten ei snart nå forbi?","Som hjorten av tørst vi forsmekter,","Gud, gi det snart morgen må bli!"],["Kun stille, min brud, til jeg kommer!","Å, frykt ei og engstes ei så!","Du ser jo det tegner til sommer,","Og kronen du snarlig skal få!"],["For himmel og jord skal vel vike,","Men aldri det løfte du fikk!","Å, tenk ei at jeg kan deg svike","For deg jeg i døden jo gikk!"],["Halleluja, amen, ja, amen!","Høylovet min brudgom så stor!","Snart skal vi få være tilsamme","For evig i himmelens kor."]],"tittel":"For Guds folk er hvilen tilbake"},{"nr":62,"seksjon":"Salmer og sanger","vers":[["Han tek ikkje glansen av livet,","Den Frelsar som kallar på deg.","Fyrst då kan for alvor du leva,","Når han får deg fylgja på veg."],["Du høyrer dei dårande røyster,","Som lovar deg gullglim og glans.","Men ingen legg lys over vegen,","Som Jesus og kjærleiken hans."],["Han hjelper i brattaste bakkar,","Og stydjer når vegen vert smal.","Han signar dei sollyse sletter,","Og lyser i dødskuggens dal."],["Han fører deg frelst over fjorden,","Heilt fram til den himmelske strand.","Når døden sin brottsjø du møter,","Vil Jesus dra båten i land."],["Han tek ikkje glansen av livet,","Han gyller din morgon og kveld.","Og opnar ei dør til dei salar,","Der æveleg høgtid du held."]],"tittel":"Han tek ikkje glansen av livet"},{"nr":63,"seksjon":"Salmer og sanger","vers":[["Herre Jesus, gi meg nåde, Kraft og mot å vandre så","At jeg deg engang får skue Og med brudekleder gå!","Da er all min nød til ende, Og min gråt til glede vendt.","Takk, o Jesus, for din nåde Som du har til jorden sendt!"],["Skynd deg, Sion, her er nåde, Stå ei stille, bli ei matt!","Se deg ikke mer tilbake Før du får din krone fatt!","Tenk på hva du har i vente, Tenk på hva du får å se","Når din Jesus deg vil hente Hjem fra jordens sorg og ve!"],["Da skal all vår trengsel endes, Ingen sorg oss tynge ned,","Verdens hat og vrede vendes Om til fryd og evig fred,","Ja, en salighet til bytte For en tid i trengsel her. Kjære sjel,","vær tro i striden, Snart, ja, snart du hjemme er!"]],"tittel":"Herre Jesus, gi meg nåde, Kraft og mot å vandre så"},{"nr":64,"seksjon":"Salmer og sanger","vers":[["Herre Jesus, lat meg læra Av ditt ord og av di gjerd,","At eg søkja skal Guds æra I mitt liv og all mi ferd;","Ikkje for mitt eige sørgja, Berre etter ein ting spørja,","Berre på det eine sjå, At Guds sak eg fremja må."],["Som din mat det var å gjera Viljen hans som sende deg,","Lat min høgste hugnad vera Deg å fylgja på den veg:","I din Faders ærend fara Medan her mi ferd skal vara,","I Guds gjerning finnast tru, Alt til enden tru som du!"],["Som den stille å kan renna Djupt i dalen sylverklår,","Så di kraft me óg kan kjenna I den stille livsgjerd vår.","Når din Ande i oss råder, Går han som ei livsens åder,","Som det djupe underdrag Gjennom alt vårt liv og lag."],["Jesus, lær oss Gud å dyrka Så som du, i alt vårt liv,","I vår helg og i vår vyrka, I den gjerning som me driv,","Så vår livnad Gud kan lova Endå i den låge stova,","Så ei fattig fiskarbu Vert ei kyrkja for vår Gud!"],["Lat oss leva då og anda For Guds æra all vår dag,","I hans gjerning stendig standa Til vårt siste andedrag!","Og når mørkret på vil falla, Og Herfrå du vil oss kalla,","Gjev oss då i grav den ros: Du i livet var vårt ljos!"]],"tittel":"Herre Jesus, lat meg læra Av ditt ord og av di gjerd"},{"nr":65,"seksjon":"Salmer og sanger","vers":[["Herre samle nu oss alle Om ditt dyrebare ord!","Som et vårregn la det falle På vårt hjertes tørre jord!","Nådig du din ånd oss sende, Og din ild iblant oss tenne,","La oss i vår armod kjenne Kraften fra ditt rike bord!"],["Lær oss trolig å ta vare På det ord oss givet er,","Led oss i ditt lys, det klare, På den vei som til deg bær!","Gjør vårt hjerte for deg stille, La ei vantro oss forville,","Herre, la oss ei forspille Nådens stund når du er nær!"],["La oss akte vel på tiden Mens du søker oss, o Gud!","Snart går nådens tid, og siden Får vi ikke flere bud.","O så hjelp oss nå å høre Hva vår sjel kan salig gjøre,","Opplat du vårt hjertes øre, Hør oss du, vår frelses Gud!"]],"tittel":"Herre samle nu oss alle Om ditt dyrebare ord"},{"nr":66,"seksjon":"Salmer og sanger","vers":[["Hvi skulle jeg sørge, jeg har jo en venn","Som bær på sitt hjerte min nød.","Den vennen er Jesus, han elsker meg enn","Han elsker i liv og i død."],["Kor: Han går ved min side, han leder min gang","Han blir ikke trett han som jeg.","Og nådig han vokter meg livsdagen lang,","Han sviker ei, svikter meg ei."],["Han har meg utkåret så ussel jeg var,","Av nåde jeg er nå hans brud.","Han vil meg ei slippe, det løftet jeg har,","Før hjemme jeg er hos min Gud."],["Jeg frykter ei mere for helvetes makt,","Min borg det er Israels Gud.","Han skal meg bevare, for det har han sagt,","Han kan ikke glemme sin brud."],["Så reiser jeg trygt til mitt herlige land","Tross bølgene skyhøye går.","Om Frelseren sover i båten iblant,","Han er dog i båten ombord."]],"tittel":"Hvi skulle jeg sørge, jeg har jo en venn"},{"nr":67,"seksjon":"Salmer og sanger","vers":[["Hvor herlig klinger Jesu navn","For sjelen syk og sår!","Det lindrer nød, det mildner savn","Når det til hjertet når."],["Det løfter den som bøyes ned,","Det stilner storm og strid.","Til hvileløs det bringer fred","Og håp til evig tid."],["Det navn er manna for min sjel,","Min rikdom og mitt gull.","Det er min skatt, min arvedel","Av bunnløs nåde full."],["Det navnet er mitt faste skjold","Mot ondskaps åndehær,","En festning sterk mot Satans vold,","Der skjult og trygg jeg er."],["Min siste sang på denne jord","Blir Jesu kjære navn.","Min første sang blant englers kor","Blir også Jesu navn."]],"tittel":"Hvor herlig klinger Jesu navn"},{"nr":68,"seksjon":"Salmer og sanger","vers":[["Hvor salig er den lille flokk","Som Jesus kjennes ved!","I ham, sin Frelser, har den nok","Nu og i evighet.","I kjærlighet, i håp og tro","Den vandrer her, og hist skal bo","Med ham når håp og tro forgår,","Men kjærlighet består."],["Min Jesus, er jeg en av dem,","Vil du meg kalle din?","Står jeg for deg som hine fem","Med lys i lampen min?","O la meg ei til hvile gå","Før derom jeg kan visshet få,","Før du kan få det svar av meg:","Du vet jeg elsker deg."],["Og måtte det med gråt enn skje","At sådant svar jeg gav,","Så vil du nådig til meg se","Og tørre tåren av.","Ja når kun du som allting vet,","Hos meg kan finne kjærlighet","Og kjenne meg iblant din flokk","Som din, så har jeg nok."]],"tittel":"Hvor salig er den lille flokk"},{"nr":69,"seksjon":"Salmer og sanger","vers":[["Jag har hört om en stad ovan molnen,","Ovan jordiska dimhölja länder,","Jag har hört om dess solljusa stränder,","Och en gång, tänk en gång är jag där.","Halleluja, jag högt måste sjunga","Halleluja, jag går till den staden.","Om än stegen blir trötta och tunga,","Bär det uppåt, ja, hemåt ändå."],["Jag har hört om ett land utan tårar,","Utan sorg, utan nöd, utan strider.","Och där ingen av sjukdom mer lider,","Och en gång, tänk en gång är jag där.","Halleluja, där fröydas vi alla,","Halleluja, vart tvivel försvunnit.","Aldrig mer skall jag stappla och falla,","Jag är framme, ja, hemma hos Gud."],["Jag har hört om den snövita dräkten","Och om glansen av gyllene kronor.","Jag har hört om den himmelska släkten","Och en gång, tänk, en gång er jag där","Halleluja, jag fröydas i anden,","Jag kan höra den himmelska sången,","Och det sliter i jordiska banden","Ty jag vet jag skall snart vara där."]],"tittel":"Jag har hört om en stad ovan molnen"},{"nr":70,"seksjon":"Salmer og sanger","vers":[["Jag kan icke räkna dem alla,","De prov på Guds godhet jag rönt;","Likt morgonens droppar de falla","Och glimma likt dessa så skönt.","Jag kan icke räkna dem alla,","De prov på Guds godhet jag rönt."],["Likt stjärnornas tallösa skara","De hava ej namn eller tal,","Men stråla likt dessa så klara","Jämväl i den mörkaste dal.","Likt stjärnornas tallösa skara","De hava ej namn eller tal."],["Jag kan icke räkna dem alla,","Men ack, må jag tacka dess mer.","Guds kärleks bevis må jag kalla","De under av nåd han beter.","Jag kan icke räkna dem alla,","Men ack, må jag tacka dess mer."]],"tittel":"Jag kan icke räkna dem alla"},{"nr":71,"seksjon":"Salmer og sanger","vers":[["Jeg råde vil alle i ungdommens dage","At de dog i tide må tenke seg om.","Man kan ikke kalle de dager tilbake","Man kan ikke vite når Gud holder dom."],["Kor: Når lyset blir utslukt, Og himlens dør blir lukt,","Når dagen er omme Og natten vil komme,","Da er det for sent til å tenke seg om."],["I dag når du hører den kallende stemme,","Han drage deg vil inn i Faderens favn.","Ja, titt i din sjel du hans røst kan fornemme,","Han lokker deg ømt, og han nevner ditt navn."],["Se tiden den skrider, og dagen den lider,","Og solen alt rødmer mot tidenes kveld!","Det gjelder for alle å Herren påkalle,","Det gjelder å gripe den salige del."],["Ja, måtte vi vandre i hånd med hverandre,","Og haste med flid imot himmelens land!","Det gjelder å bede og holde seg rede,","Skal vi kaste anker på salighets-strand."]],"tittel":"Jeg råde vil alle i ungdommens dage"},{"nr":72,"seksjon":"Salmer og sanger","vers":[["Jesus, hjelp meg å begynne","I ditt navn alt hva jeg gjør,","Så jeg fremad kan meg skynde,","Og så slutte som jeg bør.","Kom, å Jesus, bli meg nær!","La meg være der du er!"],["Gud la mine ord og tanker,","Alltid være styrt av deg!","Hjelp meg så jeg flittig sanker","Det som evig gagner meg.","Kom, å Jesus, bli meg nær!","La meg være der du er!"]],"tittel":"Jesus, hjelp meg å begynne"},{"nr":73,"seksjon":"Salmer og sanger","vers":[["Livet forsvinner i hast som en drøm,","År etter år iler bort.","Livet henrinner lik brusende strøm,","Skyndsomt det iler så fort."],["Dager som går, kommer aldri igjen,","Så lyder vekslingens bud.","Dog blir ei glemt hva som gjordes på dem,","Nei, det står tegnet hos Gud."],["Fader og moder forlater de små,","På denne jordlivets ferd.","Dødsenglen kaller og de må da gå,","Inn i den evige verd."],["Barn rykkes bort fra foreldre og lek,","Ynglingen ligger der død.","Jomfruen hviler på båren så blek,","Nyss var hun blomstrende rød."],["Husk da, o sjel, nådetiden den flyr,","Livet så hastig går om.","Søk å benytte minutter så dyr,","Tenk på Guds rettvise dom."],["Salig hver sjel som har funnet sin Gud,","Og som har Frelseren kjær.","Snart vil han komme i skyen med bud,","For å hjemhente sin brud."]],"tittel":"Livet forsvinner i hast som en drøm"},{"nr":74,"seksjon":"Salmer og sanger","vers":[["Lær meg å kjenne dine veie","Og gå dem trøstig skritt for skritt!","Jeg vet at hva jeg fikk i eie,","Er borget gods, og alt er ditt.","Men vil den sterke hånd meg lede,","Jeg aldri feil på målet ser,","Og for hvert håp som dør her nede,","Får jeg et håp i himlen mer."],["Lær meg å kjenne dine tanker","Og øves i å tenke dem!","Og når i angst mitt hjerte banker,","Da må du kalle motet frem!","Når jeg har tenkt meg trett til døden,","Så si hva du har tenkt, o Gud!","Da kan jeg se at morgenrøden","Bak tvil og vånde veller ut."],["Men lær meg fremfor alt å kjenne","Din grenseløse kjærlighet,","Den som kan tusen stjerner tenne","Når lykkens sol for meg går ned.","Den tørrer tåren som den skapte,","Og leger såret som den slo.","Dens vei går gjennom det vi tapte,","Den gir oss mere enn den tok!"]],"tittel":"Lær meg å kjenne dine veie"},{"nr":75,"seksjon":"Salmer og sanger","vers":[["Løftene kan ikke svikte,","Nei, de står evig fast!","Jesus hvert ord har beseglet","Den gang hans hjerte brast."],["Kor: Himmel og jord skal brenne,","Høyder og berg forsvinne,","Men den som tror, skal finne:","Løftene rokkes ei!"],["Tro, når det mørkner på ferden:","Solen ei sloknet har!","Kun noen timer - og siden","Stråler en morgen klar!"],["Tro, selv om vennene svikter,","Tro, når kun en står med:","Jesus, din venn, vil deg følge","Daglig med all sin fred!"],["Tro under alt som deg møter,","Snart du jo hjemme er!","Da skal du evig få skue","Det som du trodde her."]],"tittel":"Løftene kan ikke svikte"},{"nr":76,"seksjon":"Salmer og sanger","vers":[["Min Frelser, du som legedommen eier","For hvert et sår jeg fikk på kampens dag,","Kan jeg ei komme til deg med min seier,","Så kan jeg komme med mitt nederlag."],["Og kan jeg ei med lovsang i mitt hjerte","Med takkesalmer deg i møte gå,","Så kan jeg komme med min nød og smerte,","Og med en ydmyk bønn for tronen stå."],["Kan jeg ei se deg åpent inn i øyet","Og glede meg i all din kjærlighet,","Så kan jeg dog mitt hode for deg bøye","Og slå mitt blikk i anger for deg ned."]],"tittel":"Min Frelser, du som legedommen eier"},{"nr":77,"seksjon":"Salmer og sanger","vers":[["Nå gled deg i Herren, mitt hjerte,","Og juble, min sjel, i din Gud!","Kast fra deg den tærende smerte","På Guds den allmektiges bud.","Hvor meget du enn har å lide,","Kan du som har Gud ved din side,","I lovsang og takk bryte ut!"],["Se, allting for intet han gav deg!","Fremdeles han allting deg gir!","Den byrde du bar, tar han fra deg","Og stadig fra nød deg befrir.","Vinn over din hang til å nøle!","Fatt mot! Og ditt hjerte skal føle","Den himmelske fred som forblir."],["Når freden et hjerte bevarer,","Stor rikdom det eier, og makt.","Det slutter å regne og spare","Og stå om sitt eget på vakt.","Det byr alt det bitre å vike","Og oppdager kilder så rike","I lidelsens brennende trakt."],["O Jesus, den fred som vi søker,","Den finner vi bare hos deg.","Vi famler og uroen øker,","Så snart vi glir bort fra din vei.","Min tro kan jeg nære på miste.","Du seiret helt inn til det siste.","O Herre, så tro du for meg!"]],"tittel":"Nå gled deg i Herren, mitt hjerte"},{"nr":78,"seksjon":"Salmer og sanger","vers":[["O Jesus, åpne du mitt øye,","Så jeg kan se hvor rik jeg er.","Jeg har en Fader i det høye,",":/: Som Faderomhu for meg bær. :/:"],["Jeg har en bror som ved Guds side,","Vet om min sak og ber for meg.","Jeg har en nådestrøm så vide,",":/: Som himlens hvelving strekker seg. :/:"],["Jeg har en talsmann tro i nøden,","En trøster og en hjelper god.","Jeg har et evig liv i døden,",":/: En evig fred i Jesu blod. :/:"],["Jeg har et evighetens rike,","Et nåderike, det er sant.","Jeg har en krone uten like,",":/: En arv som Jesus til meg vant. :/:"],["Ei burde jeg da gå å sørge,","Jeg er en mektig konges brud.","Skjønt tvil og vantro vil meg spørre,",":/: Hvor er din høyhet og ditt skrud? :/:"],["O Jesus Krist, forøk meg troen,","Så jeg kan se min herlighet.","Og aldri, aldri glemme kronen,",":/: Du har beredt fra evighet. :/:"]],"tittel":"O Jesus, åpne du mitt øye"},{"nr":79,"seksjon":"Salmer og sanger","vers":[["O åpne ditt hjerte for Herren,","Si synden og verden farvel!","I fremmede landet det fjerne","Så lett du kan tape din sjel."],["Du ungdom, som gledes i våren,","Lik blomsten mot livet du ler,","Snart død kan du hvile på båren,","Husk alltid: Guds øye deg ser!"],["La Satan ei sjelen forderve","Og fange i fristelsens garn,","Når Jesus har villet erverve","Deg arv med Guds frigjorte barn!"],["Å, vent ikke, vent ikke lenger,","Men skynd deg til Frelseren hen!","Å, ve om ditt hjerte du stenger","For ham, din forsoner og venn!"],["Den hvitkledde skare for tronen","Nå synger en frydefull sang.","Skal du også gripe den tonen","Blant engler hos Jesus en gang?"],["I dag la med Gud deg forsone,","Kan hende ei bud mer deg når.","For snart skal du stå for hans trone,","Der dommen av Herren du får."],["Så fly til den fristaden skjønne,","Til Frelserens vunder og sår.","Barmhjertighet der du skal finne,","Forløsning i blodet du får."]],"tittel":"O åpne ditt hjerte for Herren"},{"nr":80,"seksjon":"Salmer og sanger","vers":[["Se, vi går opp til Jerusalem","I hellige fastetider","Og ser hvordan Jesus, Guds egen sønn,","I stedet for syndere lider."],["Se, vi går opp til Jerusalem.","Hvem deler vår Herres smerte?","Hvem våker med Jesus i verdens natt","Og bærer hans sorg i sitt hjerte?"],["Se, vi går opp til Jerusalem,","Til Frelserens kors og pine,","Til Lammet som ofres for verdens skyld,","For syndene dine og mine."],["Se, vi går opp til Jerusalem,","Til byen med glans og ære,","For Frelseren sa oss at der han er,","Skal vi ved hans nåde få være."]],"tittel":"Se, vi går opp til Jerusalem"},{"nr":81,"seksjon":"Salmer og sanger","vers":[["Skal vi møtes hist ved floden,","Der hvor ingen bølge slår,","I det fagre himmellandet,","I en lys og evig vår?"],["Kor: Møtes vi, møtes vi,","Møtes vi engang ved floden?","Møtes vi engang ved floden,","Hvor ei nogen bølge slår?"],["Skal vi høre sang av frelste","Bruse som et mektig hav?","Høre lovsang fra de eldste,","Kor som aldri stilner av?"],["Skal vi møte våre kjære,","Se dem glade der igjen?","Evig sammen med dem være,","Aldri skilles venn fra venn?"]],"tittel":"Skal vi møtes hist ved floden"},{"nr":82,"seksjon":"Salmer og sanger","vers":[["Som ungdom jeg ønsker å eie","Det største som livet kan gi.","Jeg søkte på syndige veie","Men fant ikke lykken deri.","Jeg hørte en stemme som kalte","På barnet som tumlet seg bort","Da Kristus for livet jeg valgte,","Og åpen jeg fant himlens port."],["Kor: Å ungdom, hva kan det deg tjene","Om verden, dens lyst blir din del?","Du eier et liv kun det ene,","Og tenk om du taper din sjel."],["Jeg ser at Guds sønn måtte lide,","For syndene mine det var.","Jeg ser all Getsemane kvide,","Jeg ser ham forlatt av sin Far.","Han kjempet men vant også seier.","Til seier han og har meg kalt.","Jeg tjene ham vil, han meg eier,","Jeg gir han min ungdom, mitt alt."],["Jeg kan nok bli trett i min jagen,","Når veien blir bakket og tung.","Men aldri jeg angrer den dagen,","Jeg valgte min Frelser som ung.","Jeg ser hen mot målet og glemmer,","De skrammer på veien jeg får.","Og snart jeg for evig istemmer,","Min sang når i himlen jeg står."]],"tittel":"Som ungdom jeg ønsker å eie"},{"nr":83,"seksjon":"Salmer og sanger","vers":[["Store Gud, vi lover deg,","Priser lytt din makt og ære,","Stemmer opp fra jorderik","Evig sang med englehære!","Vend mot oss ditt velbehag","Og vårt hjertes takk mottag!"],["For din hvite trone står","Syngende den store skare,","Hilser evighetens år,","Frelst fra jordens nød og fare.","Mektig bruser sangens lyd:","Hellig, hellig, Herre Gud!"],["Himmelriket med Guds ord","Sine grenser vidt utvider,","Favner hvert et folk på jord,","Stunder mot de sæle tider","Da, o Jesus Krist, for deg","Hvert et kne skal bøye seg."],["Hellig Ånd, med lys og makt,","Ett med Faderen og Sønnen,","Kom som Jesus selv har sagt,","Styrk oss troen, håpet, bønnen!","Fyll hver fattig sjel som tror","Med den kraft som i deg bor!"]],"tittel":"Store Gud, vi lover deg"},{"nr":84,"seksjon":"Salmer og sanger","vers":[["Styr du min vandring, Frelser så kjær,","Slik at den leder dit der du er,","Og la mitt øye Skue din høye","Herlighet der!"],["Sorgene tynger, angsten er nær,","Herre, du vet jeg har deg så kjær.","Trykket av trengsel, Grepet av lengsel","Gråter jeg her."],["Andre går bort, men du hos meg står,","Trøst i min sorg hos deg kun jeg får.","Såret som smerter, Nedbrutte hjerter","Du blott forstår."],["Hjelp meg, o Gud, mitt håp står til deg","Nå når hvert lys er slokt på min veg!","Ro jeg ei gir deg Før enn du frir meg.","Signe du meg!"],["Herre, din nådes kraft la meg få","Så jeg med mot kan videre gå,","Styrk meg og bær meg, Leg meg og lær meg","Himlen å nå!"],["Snart skal jeg møte frigjort og glad","Venner og kjære frelst i Guds stad","Sorgen vi glemmer, Glade istemmer","Frelserens kvad."]],"tittel":"Styr du min vandring, Frelser så kjær"},{"nr":85,"seksjon":"Salmer og sanger","vers":[["Syng høyt om Herrens miskunnhet!","Guds Sønn er kommet med Guds fred,","Sitt folk til gagn og gode!","Han frir oss ut fra evig nød,","Han skal beseire synd og død","Og knuse ormens hode.","I Davids by, i Betlehem","Gikk opp et lys som stråler frem","Til alle folk og tider.","Se, sannhet nåde, salighet","Igjennom tid og evighet","Som klare strømmer skrider."],["Stå opp, Guds menighet, med fryd!","La høres nå basuners lyd!","Gi Gud i himlen æren!","Bryt ut og syng, du Jesu brud:","Min ånd den fryder seg i Gud,","Min sjel opphøyer Herren!","Se, all min sorg er svunnet bort,","For store ting har Herren gjort,","Hans makt har jeg fått kjenne.","Han åpnet har sin faderfavn,","Hans lov skal høres, som hans navn,","Helt inntil verdens ende."]],"tittel":"Syng høyt om Herrens miskunnhet"},{"nr":86,"seksjon":"Salmer og sanger","vers":[["Ta Jesus med hvorhen du lenges,","Da blir du lys og glad i sinn!","Men hvor din Frelser utestenges,","Der må du ikke selv gå inn!","Ta Jesus med på dine veie,","Så tør du være dem bekjent,","Og be ham våke ved ditt leie","Når dagens travle verk er endt!"],["Ta Jesus med når du er hjemme,","Og livet går sin vante gang,","At han i deg sitt verk kan fremme,","Og tiden ei skal bli deg lang!","Og synes du at dagens byrde","Blir tung å bære lenger frem,","Ta Jesus med, den gode hyrde,","Han bærer deg og byrden hjem!"],["Ta Jesus med hvorhen du farer,","Så skal du aldri fare vill,","Da vokter på deg engleskarer,","Om verden lukker øyet til!","Og heller dagen - å, da kommer","Din Frelser selv i dødens sted,","For til en evig, evig sommer","Å take deg, en synder med."]],"tittel":"Ta Jesus med hvorhen du lenges"},{"nr":87,"seksjon":"Salmer og sanger","vers":[["Tenk når jeg min Frelser skuer,","Og hans åsyn møter mitt,","Når med jubel jeg får se ham","Som for all min synd har lidt!"],["Kor: Da skal jeg ham selv få skue","I Guds himmel, i hans prakt,","Der hvor åsyn møter åsyn -","Se ham i hans kongemakt."],["Her kun svakt mitt øye ser ham,","Enn et forheng skiller ad.","Men en salig dag seg nærmer,","Fylt av hjertets seierskvad."],["Hvilken jubel i hans nærhet,","All vår nød og smerte endt,","Hver en dunkel vei oppklaret,","Hver en sorg til glede vendt!"],["Snart vi ser ham, salig time,","Ham vi aller helst vil se,","Jesus Kristus, vår forløser,","Evig frelst fra dødens ve."]],"tittel":"Tenk når jeg min Frelser skuer"},{"nr":88,"seksjon":"Salmer og sanger","vers":[["Ute blåser kalde stormer,","Kulden vil i sjelen inn.","Verdens barn har sine normer","Som forderver unge sinn.","Der er prat om tomme gleder","Øyets lyst og dans og pynt.","Prat om dem som Jesus leder","Blir det ynkelig og tynt."],["Mange vakre roser visnet","Verdens uværsstorm var sterk.","Inntil margen treet isnet","Bortfrosset ble det gode verk.","Vingårdsmannen spør og leter","Etter frukt og sukker tungt.","Det ble gråt, han ventet gleder.","Treet var fint, så friskt og ungt."],["Den som komme skal til himlen","Må vår Fader ved sin Ånd,","Drage ut av verdensvrimlen","Med sin allmakts sterke hånd.","Derfor fikk de unge planter","Mot og kraft å vende om.","Samles nå fra alle kanter","Inntil salig kristendom."],["Lik et fruktbart tre ved sommer","Står vår ungdomsflokk på rad.","Dager svinner, nye kommer,","Treet skyter friske blad.","Jesu blod har gjødslet roten.","Ord fra Gud ga stammen kraft,","Samme ord ble vei for foten","Og ga greinen livets saft."],["Men en dag må sommeren slutte,","Innhøstningstid og alt blir koldt.","Engler sendes for å kutte","Av det band som livet holdt.","Tornekronens kvasse pigger","Laget sår i Jesu kropp.","Unge venn, se foran ligger","Gledens land. Se fram. Se opp."]],"tittel":"Ute blåser kalde stormer"},{"nr":89,"seksjon":"Salmer og sanger","vers":[["Velsigna band som bind Guds folk i saman her,","I same kjærleik, same sinn Som i Guds himmel er."],["Vi er av kongeætt, Eit heilagt syskenlag,","Men ser vår høge adel rett Fyrst på den store dag."],["Her skil dei store hav Guds folk i ymse land,","Men bundne saman vert vi av, Dei sterke Åndens band."],["Her er kje fri og træl, Her er kje arm og rik,","Kvar har den same arvedel, Og er dei andre lik."],["Om nokon av oss lid, Så græt vi andre med,","Og vert han atter løyst og fri, Vi oss med honom gled."],["Vi kjenner saknad sår, Når vi her skiljast må,","Men vonar i Guds rikes vår, Kvarandre atter sjå."]],"tittel":"Velsigna band som bind Guds folk i saman her"},{"nr":90,"seksjon":"Salmer og sanger","vers":[["Å, at jeg kunne min Jesus prise","Som jeg av hjertet dog så gjerne vil,","Fordi han ville slik nåde vise","Å byde meg sitt himmerike til!"],["Jeg gikk i blinde, jeg lå i døden,","Og mørkets fyrste holdt meg ganske fast.","Da ropte jeg til min Gud i nøden,","Han frelste meg, og mørkets lenker brast."],["Ha takk, o Jesus, for korsets smerte,","For døden og for dine mange sår!","Der fikk jeg fred for mitt arme hjerte,","Og vinteren ble til en herlig vår."],["Opp, alle venner, syng med i sangen","Til ære, pris for ham som har oss løst!","Vi går i trengsel og strid så mang en,","Men kun en liten stund, å hvilken trøst!"],["Snart er vi hjemme og står for tronen,","Hva gjør det da om solen har oss brent?","Når hytten faller, så får vi kronen,","Og all vår trengsel er for alltid endt."],["Ja, deg alene skje evig ære,","O Jesus, som oss kjøpte med ditt blod!","Vår syndebyrde du ville bære,","Det skyldbrev slette som var oss imot."],["Å hvilken lykke å deg tilhøre!","Takk, takk at også jeg fikk være med!","Din gode gjerning du selv fullføre,","Til jeg står fri og frelst i evighet!"]],"tittel":"Å, at jeg kunne min Jesus prise"},{"nr":91,"seksjon":"Salmer og sanger","vers":[["Å, hvor salig det skal blive","Når Guds barn får komme hjem,","Ingen kan den fryd beskrive","Å få bo i himmelen!",":/: Skue Jesus, skue Jesus","Når han henter sine hjem. :/:"],["Å, hvor salig, å, hvor salig","Å få tro på Jesus her,","Men dog enda mere salig","Å få se ham som han er!",":/: Være hjemme, være hjemme,","Fri fra sorger og besvær. :/:"],["Gud skje lov, snart får jeg tage","Avskjed fra min vandring her,","Slippe fri fra sorg og plage,","Komme hjem til himlen der,",":/: Og i evig, evig glede","Være Herren Jesus nær! :/:"],["Der vi slipper skilles mere,","Ingen tåre felles der,","Ingen sorger skal der være,","Herligheten kommet er.",":/: Å den dagen, å den dagen,","Give Gud den snart var nær! :/:"],["Vær frimodig, du skal vinne","Veien frem til hvilens hjem!","Jesus alltid ha i sinne,","Løft ditt blikk mot himmelen:",":/: Jesus kommer, ja, han kommer","Snart og henter sine hjem! :/:"]],"tittel":"Å, hvor salig det skal blive"},{"nr":92,"seksjon":"Salmer og sanger","vers":[["Å, kor djup er Herrens nåde - Som eit hav, så djup og vid!","Å, kor kjærleg er hans rettferd, Som kan meir enn gjere fri!","Det er ingen som kan kjenne Våre sorger slik som Gud,","Ingen domar som så venleg Slettar brot og synder ut."],["Det er rikeleg forløysing I vår Jesu dyre kross.","Det er song og evig glede I det blod som rann for oss.","Og vart hjarta fylt av kjærleik Ved vår tru på ordet hans,","Då vart livet til ein stråle Av Guds herlegdom og glans."]],"tittel":"Å, kor djup er Herrens nåde - Som eit hav, så djup og vid"},{"nr":93,"seksjon":"Salmer og sanger","vers":[["Jag vet en port, som öppen står, Där från de gyllne salar.","En klarhet, som från korset går, Om Kristi kärlek talar."],["Kor: O djup av nåd, min Gud hos dig,","Att porten öppen står för mig,","För mig, för mig, Står öppen och för mig."],["Den öppen står får varje själ, Som nådens ord anammar,","För rik och fattig, kung och träl, För alla folk och stammar."],["Så skynda fram trots oväns hot, Förrn porten sluten bliver,","Och kors och krona tag emot, Som Frälsaren dig giver."],["Då vi på andra stranden stå, Läggs korset av, det tunga.","Oss livets krona skänkes då, Och Jesu lov vi sjunga."]],"tittel":"Jag vet en port, som öppen står, Där från de gyllne salar"},{"nr":94,"seksjon":"Salmer og sanger","vers":[["O store Gud, når jeg i undring aner,","Hva du har skapt i verden ved ditt ord.","Ser universet med de mange baner,","Og vet alt liv oppholdes ved ditt ord.",":/: Da bryter lovsang ifra sjelen ut:","O store Gud, o store Gud! :/:"],["Når vårens vinder suser over trakten,","Når blomster dufter skjønt ved bekkens fot.","Når lerken jubler over sommerprakten","Og furuskogens ange slår imot.",":/: Da bryter lovsang ifra sjelen ut:","O store Gud, o store Gud! :/:"],["Når jeg i Skriften ser de mange under,","Som Gud har gjort fra Adams første tid,","Og ser hvor trofast Herren alle stunder","Har ført sitt folk igjennom livets strid;",":/: Da bryter lovsang ifra sjelen ut:","O store Gud, o store Gud! :/:"],["Når så til slutt hvert tidens slør må falle,","Og troens mål er nådd, så jeg får se,","Vil evighetens klokker sjelen kalle","For tronen mellom skaren hvit som sne;",":/: Da bryter lovsang ifra sjelen ut:","Takk store Gud, takk store Gud! :/:"]],"tittel":"O store Gud, når jeg i undring aner"},{"nr":95,"seksjon":"Salmer og sanger","vers":[["Ungdommens lykke er samfunn med Gud,","Vite seg fri, være Frelserens brud,","Kjenne den kraften som allting formår,","Eie den freden som aldri forgår."],["Kor: Ingen som Jesus gjør livsdagen skjønn,","Alt du behøver, du har i Guds Sønn.","Kom da til Kristus, ja, kom hvem som helst!","Lykkelig den som fra synden er frelst!"],["Ungdommens lykke er livet for Gud,","Villig ham tjene og lyde hans bud,","Berge for himlen de villfarne får,","Lykkelig den som i tjenesten står!"],["Ungdommens lykke er himlen til sist,","Evighetsliv uten savn eller brist,","Veien er banet, og målet er nær,","Lykkelig den som på himmelvei er!"]],"tittel":"Ungdommens lykke er samfunn med Gud"},{"nr":96,"seksjon":"Salmer og sanger","vers":[["Høyt fra det himmelske høye Vennlig et blikk på deg ser.","Ser du det smilende øye? Stille, hva ønsker du mer?"],["Om enn et stormvær seg nærmer, Om deg enn truer en hær,","Frykt ei! Din Fader deg skjermer. Stille, hva ønsker du mer?"],["Gråter du? Han teller tårer. Klager du? Han er deg nær.","Han leger alt som deg sårer. Stille, hva ønsker du mer?"],["Bliver i mødige stunder Ofte deg lengselen svær.","Søtt du i døden henblunder, Stille, hva ønsker du mer?"]],"tittel":"Høyt fra det himmelske høye Vennlig et blikk på deg ser"},{"nr":97,"seksjon":"Salmer og sanger","vers":[["O bli hos meg! Nu er det aftentid,","Og mørket stiger, dvel o Herre blid!","Når annen hjelp blir støv og duger ei,","Du hjelpeløses hjelper, bli hos meg!"],["Snart svinner livets dag, det kvelder fort,","Og jordens lys alt mørkner og går bort,","Forandrings skygge følger tro min vei,","O du som ei forandres, bli hos meg!"],["Hver time trenger jeg din sterke vakt,","Kun for din nåde viker mørkets makt,","Hvor skal jeg vandre trygt foruten deg?","I mulm og solskinn, Herre, bli hos meg!"],["Når du velsigner, ei av frykt jeg vet,","Sår gjør ei ondt, gråt har ei bitterhet,","Hvor er din brodd, du siste fiende? Nei -","Ved deg jeg seirer; Herre, bli hos meg!"],["O la meg se ditt kors i dødens gys,","Driv mørket bort og vær meg livets lys!","Da skinner morgenrøden på min vei!","I liv og død, o Herre, bli hos meg!"]],"tittel":"O bli hos meg! Nu er det aftentid"},{"nr":98,"seksjon":"Salmer og sanger","vers":[["Jesus, det eneste, Helligste, reneste","Navn som på menneskeleber er lagt!","Fylde av herlighet, Fylde av kjærlighet,","Fylde av nåde og sannhet og makt."],["Motganger møter meg - Aldri du støter meg","Bort fra din hellige, mektige favn.","Mennesker glemmer meg, Herre du gjemmer meg","Fast ved ditt hjerte og nevner mitt navn."],["Herre, du høre meg, Herre, du føre meg","Hvordan og hvorhen det tjener meg best!","Gi mig å bøye meg, Lær mig å føye meg","Etter din vilje mens her jeg er gjest."],["Du er den eneste, Helligste reneste,","Gi meg ditt rene og hellige sinn!","Frels meg av snarene, Fri meg fra farene,","Ta meg til sist i din herlighet inn!"]],"tittel":"Jesus, det eneste, Helligste, reneste"},{"nr":99,"seksjon":"Salmer og sanger","vers":[["Si meg det gamle budskap, Det beste som jeg vet,","Om Jesus og hans ære Og om hans kjærlighet!"],["Si meg det kun så simpelt Som barn på fire år,","For jeg er syk og såret Og lite kun formår."],["Si meg det klart og sindig, Jeg fatter det så sent,","Guds råd mot syndens våde, Det frelsens under rent."],["Si meg det mange ganger, Jeg glemmer det så lett,","Akk morgenduggen tørres Når solen brenner rett."],["Si meg det mildt og stille, Med alvors dype røst,","Husk på jeg er den synder Som Jesus har forløst."],["Si meg det gamle budskap, Det beste som jeg vet,","Det budskap uten like Om Jesu kjærlighet!"]],"tittel":"Si meg det gamle budskap, Det beste som jeg vet"},{"nr":100,"seksjon":"Salmer og sanger","vers":[["I himmelen, i himmelen, Hvor Gud vår Herre bor,","Der får vi ham å skue snart I salighet så stor,",":/: Og synger hellig, hellig der :/: Nær Herren Sebaot!"],["I himmelen, i himmelen, Ja der er klarhet fin,","Så at den klare solen selv Ei kommer nær med sin,",":/: Der åsyn vi til åsyn står :/: Nær Herren Sebaot!"],["Av klarheten i himmelen De frelste skinne skal,","Alt som den klare solen selv Vidt over stjerner all,",":/: Og vorde englers like der :/: Nær Herren Sebaot!"],["Og sjelen får sin prydelse, Som hen for den er lagt,","Rettferdighetens brudekrans Og så den hvite drakt",":/: Med salig fryd og evig fred :/: Nær Herren Sebaot!"],["Og dødens hårde stridestund, O Herre, lindre vel,","Når det til enden lider da, O Herre, ta vår sjel,",":/: Og la oss få en evig ro :/: Nær Herren Sebaot!"]],"tittel":"I himmelen, i himmelen, Hvor Gud vår Herre bor"},{"nr":101,"seksjon":"Salmer og sanger","vers":[["Ungdommens Frelser, hør oss når vi beder:","Let etter dem som ennå selv ei leter!","Døvet av verdens lyst og larm og pine,",":/: Er de dog dine! :/:"],["Og når du hører sjelens sukk det stille,","Ser hvor de lenges uten rett å ville,","Lær du dem da på bønnens vinger stige",":/: Opp til ditt rike! :/:"],["Vis dem deg selv, så unge øyne stråler!","Gi dem din kraft, som bærer og som tåler!","Salv dem med ånd, at de må seier have",":/: Over det lave! :/:"]],"tittel":"Ungdommens Frelser, hør oss når vi beder"},{"nr":102,"seksjon":"Salmer og sanger","vers":[["Å, var eg meir deg, Jesus, lik,","So hjartevarm og god,","Med same kjærleik utan svik","Som du i striden stod.","Å, var eg meir med liv og tru","I alle ting som du, som du,","Min Gud, kor sæl eg var!"],["Kven kann få sagt kor stort det var,","At du kom til oss her,","Og himlen ned på jordi bar","Med song av engleher?","Å, var mitt liv ei himmelbru,","I alle ting som du, som du,","Min Gud, kor sæl eg var!"],["So sjå meg i mitt hjarta inn,","Min Frelsar kjær, og seg","Um du derinne noko finn","Som ikkje er av deg.","Du tankar, ord og liv må snu","Mot deg, so eg vert meir som du.","Min Gud, kor sæl eg er!"],["Ja, bøyg meg, bøyg meg ned for deg,","Og set meg ved din fot.","Alt stort og stolt du finn i meg,","Du rive upp med rot!","På denne staden vil eg bu,","So vert eg meir som du, som du.","Min Gud, kor sæl eg er!"],["Din strid, min Frelsar, var so stor","At sveiten rann som blod.","Å, send meg krafti av ditt ord,","Og gjev meg same mod.","Den fadersmil som tek all gru,","Den fær eg og, for den fekk du.","Min Gud, kor sæl eg er!"]],"tittel":"Å, var eg meir deg, Jesus, lik"},{"nr":103,"seksjon":"Salmer og sanger","vers":[["Jeg så ham som barn med det solrike øye","I regnbuens glans på de hjemlige høye,","Han kysset mitt kinn, og vi lekte med stjerne,","Mens korset stod skjult mellom løv i det fjerne."],["Jeg så ham som yngling i livskraftens morgen,","Da ånden fløy høyt imot herlighetsborgen,","Han vinket min sjel, og jeg glemte det lave,","Hans ild kastet glans på forkrenkelsens grave."],["Jeg så ham som mann i den modnere sommer,","Da synderen skalv for den hellige dommer,","Da hjertet slo tungt og min isse var senket,","Og dødstanken strengt hadde livsmotet lenket."],["Først da fikk jeg kjenne hans salige nåde,","Først da løstes korsets, forargelsens gåte,","Først da lærte hjertet å favne den byrde","Som han har meg rakt, den forbarmende hyrde."],["Først da har jeg sagt ham hva før jeg ei visste,","At han er den første og bliver den siste,","Først da har jeg sagt at med ham vil jeg følge","I liv og på dødens den rullende bølge."],["Og en gang jeg ser ham når lyset nedbrenner,","Da rekker jeg mot ham de segnende hender,","Når hjertet står stille og øyet vil briste,","Da hilser jeg ham med et smil, med det siste."]],"tittel":"Jeg så ham som barn med det solrike øye"},{"nr":104,"seksjon":"Salmer og sanger","vers":[["Fra bergets topp han skuer over staden,","Hvis høyder badet seg i solens skinn.","Blandt dets palasser ser han fremst i raden","Den store, stolte, fagre tempeltind.","Der høres larm og støy fra gledesfesten,","Med dans og spill fra mangt et verdslig lag.","Men når så solen synker ned i vesten","Går Jesus gråtende i Kedrons dal."],["Og Jesus gråt, hans frelserhjerte blødde","Av kjærlighet så uforlignelig,","Til dette folk som ham så koldt forstøtte.","Og hen i mørkets natt forveltet seg.","Han ser og ser med blikk som gjennomtrenger","Det fine skall som skjuler bitter nød.","Han ser at synd og vantro utestenger","Velsignelsen som han så titt dem bød."],["Jerusalem, Jerusalem du arme,","Som hastig øker dine synders tall.","Hvor ofte har jeg villet meg forbarme,","Men gang på gang forkastet du mitt kall.","Jerusalem, akk om du bare visste,","Hva som i dag kan tjene deg til fred,","Men det er skjult og dette kall mitt siste,","Ei aktet blir tross all min kjærlighet."],["Våkn opp min sjel, våkn opp du Herrens skare,","Hvor er vel du når Herren kommer ned,","Når han i sky seg selv skal åpenbare","Og hente oss til himlens lys og fred.","Når tidens sol går ned i mulm og tåke","Og verden skal av Herren få sin dom,","Da skal enhver som nu i bønn vil våke","Forklaret få med Jesus vandre om."]],"tittel":"Fra bergets topp han skuer over staden"},{"nr":105,"seksjon":"Salmer og sanger","vers":[["Kom venner, la oss vandre På himmelveien frem,","Og bede for hverandre Inntil vi når vårt hjem,","Hvor vi med fryd og glede Dem evig skue skal,","Som gikk til ærens sete Hos Gud i himlens sal."],["Kor: Hjem, hjem, vårt kjære hjem! Kom venner,","la oss vandre Til himlens rette hjem."],["Om sorg og motgang møter Oss på vår pilgrimsgang,","Så dog vi synden døder, Om veien enn er trang.","Vår trengsel er snart omme, Og da, da er vi fri","Fra motgang som kan komme På livets smale sti."],["O hvilken fryd og glede Som vi skal da oppnå,","Når vi for Gud skal trede, På gyldne harper slå.","Da skal vår lovsang tone Som mange vannes lyd,","Hvor helgen for Guds trone Skal stemme i med fryd."],["Ei tungen kan utsige Hva fryd de frelste får,","Det har slett ei sin like At for Guds trone stå","Og der mottake ære Og lønn fra Jehova.","Mens englene frembære Gud takk, halleluja!"]],"tittel":"Kom venner, la oss vandre På himmelveien frem"},{"nr":106,"seksjon":"Salmer og sanger","vers":[["Himlens fugler har dog sine reder,","Revene i skogens huler bor.","Verdens frelser hadde ingen steder","Som han kalte for sitt hjem på jord."],["Kor: Halm og høy, det var hans krybbeleie,","Ødemarken var hans hvilested.","Han som jord og himmel har i eie,","Vandret ensom om ved Jordans bredd."],["Når i bønn han talte med sin fader","Steg han opp på bergets høye topp.","Han som skapte stjerners myriader","Reiste ei seg selv en bolig opp."],["Og når folket hårdt omkring ham trengte","Alltid kjærlig han tilstede var.","Ingen fattig sjel han utestengte,","Barnene han selv på armen bar."],["Hvilken skam at vi så ofte klager,","Synes allting er så tungt og trått.","Gud vår Fader vil til seg oss drage,","Han gjør alle ting så lyst og godt."]],"tittel":"Himlens fugler har dog sine reder"},{"nr":107,"seksjon":"Salmer og sanger","vers":[["Jeg om Jesus synger, Ja om Jesus blott",":/: Alle mine synder, Har forlatt jeg fått. :/:"],["Med sitt blod utsletter Han min syndegjeld.",":/: Nådeliv oppretter Han for syndens trell. :/:"],["Knuste dødens lenker, Løste løgnens garn.",":/: Fangen frihet skjenket. Jeg nå er Guds barn. :/:"],["Barn av ham på tronen, Himlens konge er.",":/: Jeg får arve kronen, Riket får jeg der. :/:"],["Jeg får bo for evig I den gylne stad.",":/: Lammets bryllup feire, Som en gjest så glad. :/:"]],"tittel":"Jeg om Jesus synger, Ja om Jesus blott"},{"nr":108,"seksjon":"Salmer og sanger","vers":[["Ja, engang mine øyne skal","Se Kongen i hans prakt;","Få tilbede i hans tempelhall","Hans nåde og hans makt.","I et krystallklart hav av lys","Forsvinner tidens natt og gys,","Forvandlet blir hver gåte her","Til lovsangsjubel der."],["Og salighetens tonevell","Skal bruse som et hav,","Som sus av skog en sommerkveld","Når himlen er som rav.","Og gjenfødt all naturen er,","Og ingen skygge faller mer.","Og alt av skjønt mitt øye så,","Ny glans og glød vil få."],["Men skjønnest er deg dog å se","Guds Lam så underbart,","Med merkene fra korsets tre","Av seirens glans forklart.","Og dette lys er mer enn sol,","Det er Guds gylne nådestol,","Og støvets drakt som her meg bandt,","Blir klar som diamant."],["Så er jeg frelst, så er jeg fri,","Så har jeg vunnet frem.","Så er min strid med ett forbi,","Så er jeg i mitt hjem,","Det hjem min Frelser lovet har","Hver den som korset med ham bar,","Guds paradis, vårt rette hjem,","Det ny Jerusalem."]],"tittel":"Ja, engang mine øyne skal"},{"nr":109,"seksjon":"Salmer og sanger","vers":[["Å, tenk eingong når alle fram skal stemna","Til himlens port, og alle bankar på,","Det vert ei syn som ingen no kan nemna,","Kven skal gå inn, og kven skal ute stå?"],["Å, tenk eingong det stemnemøte store","Når me ved porten skal kvarandre sjå,","Me som på jordi her i lag hev vore;","Kven skal gå inn, og kven skal ute stå?"],["Å, tenk eingong um eg og du skal vera","I lag med deim som utan olje stend,","Og der vår lampa utan Ijos må bera,","Og av vår brudgom aldri verta kjend!"],["Å, tenk eingong kor stort at me fær leva","Og høyra at me kann den oljen få","Som vil oss ljos på brudlaupslampa gjeva,","So me med gleda kann til porten gå!"],["Å, tenk eingong når brudgomen skal koma","Og opna døri for si kjære brud.","Då vil vel songen høgt i himlen ljoma","Når brud og brudgom stend i himmelskrud."]],"tittel":"Å, tenk eingong når alle fram skal stemna"},{"nr":110,"seksjon":"Salmer og sanger","vers":[["Så ta da mine hender, Og før meg frem","Inntil jeg salig ender I himlens hjem!","Jeg kan ei gå alene, Enn ei et fjed;","Hvor du meg fører ene, Jeg følger med."],["La intet mer oss skille, Ta helt meg hen,","Og gjør meg ganske stille, O sjelevenn!","Ved dine føtter ene Er barnet trygt,","På deg, på deg alene Min tro er bygt."],["Selv om jeg ei fornemmer Din sterke hånd,","Min salighet dog fremmer Din gode Ånd.","Så ta da mine hender Og før meg frem","Inntil jeg salig ender I himlens hjem!"]],"tittel":"Så ta da mine hender, Og før meg frem"},{"nr":111,"seksjon":"Salmer og sanger","vers":[["Alt står i Guds faderhånd,","Hva han vil, det gjør hans Ånd -","Av Guds nåde, til Guds ære","Evig glade skal vi være",":/: I vår Herres Jesu navn. :/:"],["Visse på at arv og lønn","Har vi med Guds egen Sønn -","Av Guds nåde, til Guds ære","Evig glade skal vi være",":/: I vår Herres Jesu navn. :/:"],["Felles om hans liv og fred,","Lys og kraft og herlighet -","Av Guds nåde, til Guds ære","Evig glade skal vi være",":/: I vår Herres Jesu navn. :/:"]],"tittel":"Alt står i Guds faderhånd"},{"nr":112,"seksjon":"Salmer og sanger","vers":[["Bed for oss, o Krist,","I din himmel hist","Som du bad da du her nede","Stod for oss til striden rede,","Dødens strid til sist - Bed for oss, o Krist!"],["Se dog hvor vi går","Her i bange kår,","Fristes, snubler, lider ille,","Går mot graven årle, silde","Bed for oss som går Her i bange kår!"],["Bed din Fader mild,","Han med velde vil","Fra det onde oss bevare,","Løse den av mørkets snare","Som er faret vill - Bed din Fader mild!"],["Bed vi må på jord","Ved ditt sannhetsord","Helliges i hjertet inne,","Over synden seier vinne","La oss ved ditt ord Helliges på jord!"],["Bed vi bliver ett,","Til en nadverd stedt,","Ett i Faderen deg sendte,","Ett i deg, fra verden vendte,","For ditt verk beredt - Bed vi bliver ett!"],["Jesus, du Guds Sønn,","Ta vår ringe bønn,","Den som vi kun frem kan stamme,","Gjør den i ditt hjertes flamme","Til din egen bønn - Bed for oss, Guds Sønn!"]],"tittel":"Bed for oss, o Krist"},{"nr":113,"seksjon":"Salmer og sanger","vers":[["Dyp av nåde er hos deg, Jesus, ennu rom for meg?","Har forlatelse du mer For en synder som jeg er?"],["Jeg har stått din Ånd imot, Trådt ditt budord under fot,","Vandret villsomt langt fra deg, Er der ennu rom for meg?"],["Å, jeg er så kold og død, Eier bare synd og nød,","Tør jeg komme frem til deg, Er der ennu rom for meg?"],["Dyp av nåde - er hos deg, Jesus, ennu rom for meg,","Har min sjel du ennu kjær, Å så ta meg som jeg er!"]],"tittel":"Dyp av nåde er hos deg, Jesus, ennu rom for meg"},{"nr":114,"seksjon":"Salmer og sanger","vers":[["Eg fann min Gud i ungdoms år,","I livsens ljose, blide vår,","Det skal meg aldri anka.","Eg let min Frelsar inn til meg","Då han so kjærleg synte seg,","På hjartedøri banka."],["Eg fann min Gud i ungdoms vår,","Eg etter livsens krona trår,","Med truskap vil eg strida.","Og skal eg verta trøytt og sår,","Og um meg mykje motgang når,","Med Jesus vil eg lida."],["Eg fann min Gud i ungdoms vår,","All ungdomskraft som i meg rår,","Skal brukast til hans æra.","Skal eg med tårer sædet så,","Med frydesong eg heim skal gå","Og mine kornband bera."]],"tittel":"Eg fann min Gud i ungdoms år"},{"nr":115,"seksjon":"Salmer og sanger","vers":[["Herre Jesus, gode hyrde, Du som bar vår syndebyrde,","Gikk for oss i dødens strid, Takk skje deg til evig tid!"],["Takk for kjærlighetens under: Legedom i dine vunder!","Takk for seiren som du vant, Takk for freden som vi fant!"],["La din nåde oss inntage, La din kjærlighet oss drage,","Så vi vandrer livets vei, Herre Jesus, efter deg!"],["La ditt ansikt oss ledsage, Lyse for oss alle dage,","At vi og med korset på Kan din kjærlighet forstå!"],["Når i siste stund vi blegner, Når vi hen i døden segner,","Herre Jesus, trøst og gled Hjertet med din kjærlighet!"]],"tittel":"Herre Jesus, gode hyrde, Du som bar vår syndebyrde"},{"nr":116,"seksjon":"Salmer og sanger","vers":[["Hvor to og tre forsamlet er","I navnet ditt, o Herre,","Der vil du selv dem trede nær","Og midt iblant dem være.","Du ennu hint det under gjør","Og kommer inn ad lukket dør","Til alle dine kjære."],["Du være vil med dem hver dag","Alt inntil verdens ende;","O kom, ditt sete hos oss tag,","Og gi deg klart til kjenne,","Så ånden blir av ordet varm","Og må av glede i vår barm","Ved din fredshilsen brenne!"]],"tittel":"Hvor to og tre forsamlet er"},{"nr":117,"seksjon":"Salmer og sanger","vers":[["O Herre Krist, gå ikke bort,","Bli hos oss nu, det kvelder fort!","Kom inn og meg den glede gjør,","Tred innenfor mitt huses dør!"],["La deg nu bede, det er sent!","Du ser det hjertelig er ment,","Og vet du fremfor alle mest","Er meg så hjertenskjær en gjest."],["Du vet hvor det med meg er fatt,","Det stunder mot den mørke natt,","Så må ei du som lyset er,","Forlate meg i mørket her!"],["Lys opp, at jeg kan finne frem","Til herberg mitt og himmelhjem,","At syndemørkets natt meg ei","Forviller bort fra livets vei!"],["Og særlig i min siste nød","Hjelp du meg til en salig død!","O Herre, bli, jeg slipper deg","Ei før du får velsignet meg!"]],"tittel":"O Herre Krist, gå ikke bort"},{"nr":118,"seksjon":"Salmer og sanger","vers":[["Korset vil jeg aldri svike, Som så salig bliver endt;","Skulle jeg en kristen være Uten Kristi kors å bære?","Jesus har dog i sitt rike Aldri den disippel kjent.","Korset vil jeg aldri svike, Som så salig bliver endt."],["På de mørke ørkenganger Følger siden løftets land.","Skal vi trenges alle vegne, Er det dog kun litt å regne","Mot de klare frydesanger I fullkommenhetens stand","På de mørke ørkenganger Følger siden løftets land."]],"tittel":"Korset vil jeg aldri svike, Som så salig bliver endt"},{"nr":119,"seksjon":"Salmer og sanger","vers":[["Å tenk på Gud i ungdoms år!","All vokster god må gro um vår","Um han skal grøda gjeva.","So lat då Gud ditt hjarta få","Frå ungdom og til alder grå!","Då vert det lyst å leva."],["Å tenk på Gud i ungdoms år,","Når voni lyser ven og klår","Som vår i ljose lundar!","Når hjarteliv som blomen sprett","Og seg for ljoset opnar lett","Og etter kjærleik stundar."],["Ja, tenk på Gud i ungdoms år,","Fyrr deg dei vonde dagar når","Som du må ille lika!","Det kjem ein kveld so kald og skum,","Då vert det tungt å venda um","Og frå det vonde vika."],["So tru på Gud når du er ung,","Fyrr du vert gamal, trøytt og tung,","Og sorger hjarta fyller!","For trui adlar ungdoms år,","Gjev krona gjæv til gråe hår","Og deim med rettferd gyller."],["Gud, lat då bløma i kvar bygd","Ein ungdom rik på tru og dygd,","Og lær deim Kristi lydnad!","Og lat so alle gamle få","Den gode alders krona på,","Den kristne rettferds prydnad."]],"tittel":"Å tenk på Gud i ungdoms år"},{"nr":120,"seksjon":"Salmer og sanger","vers":[["Å tenk når engang samles skal","De frelstes menighet","Av alle folkeslekters tall",":/: I himlens herlighet! :/:"],["Å tenk når Herrens vidnehær,","Hans tjenere på jord,","De millioner møter der",":/: Som hørte deres ord! :/:"],["Å tenk dog hvilken jubellyd,","En strøm av kjærlighet!","Tenk hvilken takk og pris og fryd",":/: Og salighet og fred! :/:"],["O Gud, hvor er din nåde stor!","Oss alle til deg drag,","At vi må stå blandt frelstes kor",":/: På denne høytidsdag! :/:"]],"tittel":"Å tenk når engang samles skal"},{"nr":121,"seksjon":"17. mai","vers":[["Gud signe vårt dyre fedreland","Og lat det som hagen bløma!","Lat lysa din fred frå fjell til strand","Og vetter for vårsol røma!","Lat folket som brøder saman bu,","Som kristne det kan seg søma!"],["Vårt heimland i myrker lenge låg,","Og vankunna ljoset gøymde.","Men Gud, du i nåde til oss såg,","Din kjærleik oss ikkje gløymde;","Du sende ditt ord til Noregs fjell,","Og ljos yver landet strøymde."],["Og Noreg det ligg vel langt i nord,","Og vetteren varer lenge;","Men ljoset og livet i ditt ord","Det ingen kann setja stenge.","Um fjellet er høgt og dalen trong,","Ditt ord heve då sitt gjenge."],["So blømde vårt land i ljos og fred,","Det grodde so grønt i lider.","Men atter seig natt på landet ned","Med trældom og tunge tider.","Og folket, det sukka etter ljos,","Og du lyste upp um sider."],["Og morgonen rann, og myrkret kvarv,","Som lenge vår lukka skygde.","Du atter oss gav vårt fridoms arv","Og honom i trengsla trygde.","Du verna vårt folk og gav oss fred,","Og landet med lov me bygde."],["Vil Gud ikkje vera bygningsmann,","Me fåfengt på huset byggja.","Vil Gud ikkje verja by og land,","Kan vaktmann oss ikkje tryggja.","So vakta oss, Gud, so me kan bu","I heimen med fred og hyggja!"],["No er det i Noreg atter dag","Med vårsol og song i skogen.","Um sædet enn gror på ymist lag,","Det brydder då etter plogen.","So signe då Gud det gode såd,","Til groren eingong er mogen!"]],"tittel":"Gud signe vårt dyre fedreland"},{"nr":122,"seksjon":"17. mai","vers":[["Fagert er landet du oss gav,","Herre, vår Gud og vår Fader!","Fagert det stig av blåe hav,","Soli ho sprett og ho glader,","Signar vårt land i nord og sud,","Soleis di åsyn lyser, Gud,","Yver vårt Noreg i nåde"],["Likjest vårt folk i mager jord","Skjelvande blomen på bøen,","Stend utan livd i vind frå nord","Tett innmed kanten av snøen.","Herre, du ser med miskunn ned,","Folket vårt gjev du livd og fred,","Er oss so kjærleg ein Fader."],["Her ned i grunnen sveiten rann","Trufast åt fedrene våre.","Her dei sin heim og hugnad fa
